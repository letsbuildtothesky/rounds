<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rounds — เลือกภาษา</title><style>:root{--blue:#1754a6;--blue-deep:#14488d;--blue-soft:#edf4fd;--orange:#ff6420;--ink:#17283f;--muted:#526278;--line:#dce4ed;--canvas:#e9edf2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}body{padding:28px}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}[hidden]{display:none!important}
.frame{width:393px;height:852px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid #c9d3de;border-radius:20px;box-shadow:0 16px 44px #17283f14}
.statusbar{height:28px;flex:none;padding:7px 22px 4px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}.phone-status{display:flex;align-items:center;gap:7px}.phone-status i{display:block;width:19px;height:9px;border:1px solid currentColor;border-radius:2px;position:relative}.phone-status i:before{content:'';position:absolute;inset:1px 3px 1px 1px;background:currentColor}.phone-status i:after{content:'';position:absolute;right:-3px;top:2px;height:3px;width:2px;background:currentColor}
.brandbar{min-height:64px;flex:none;display:flex;align-items:center;padding:6px 22px;border-bottom:1px solid var(--line)}.brand{display:inline-flex;align-items:baseline;color:var(--blue);font-size:24px;font-weight:800;line-height:1;letter-spacing:-1.1px;white-space:nowrap}.brand i{display:block;width:6px;height:6px;background:var(--orange);margin-left:3px;flex:none}
.app{min-height:0;flex:1;display:flex;flex-direction:column}.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column}.page-hero{min-height:246px;padding:36px 22px 30px;flex:none}.eyebrow{font-size:14px;line-height:1.4;font-weight:600;color:var(--blue);margin:0 0 14px}h1{font-size:44px;line-height:1.1;letter-spacing:-1.1px;font-weight:700;margin:0;overflow-wrap:break-word}.lead{font-size:17px;line-height:1.45;color:var(--muted);margin:18px 0 0}.language-list{flex:none;margin:0 22px;border:1px solid #bacbdd;border-radius:7px}.language-row{width:100%;min-height:120px;padding:18px 20px 18px 18px;border:0;border-left:4px solid transparent;display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:20px;align-items:center;background:#fff;color:var(--ink);text-align:left;scroll-margin-block:16px}.language-row:first-child{border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}.language-row:last-child{border-radius:0 0 6px 6px}.language-row:hover{background:#f6f9fd}.language-row.selected{background:var(--blue-soft);border-left-color:var(--orange)}.language-row:focus-visible{position:relative;z-index:1;outline-offset:2px}.language-copy strong{display:block;font-size:28px;line-height:1.3;font-weight:600;letter-spacing:-.3px;overflow-wrap:break-word}.language-copy span{display:block;margin-top:6px;font-size:16px;line-height:1.45;color:var(--muted)}.radio-mark{width:28px;height:28px;border:2px solid #99aec6;border-radius:50%;display:grid;place-items:center}.selected .radio-mark{border-color:var(--blue)}.selected .radio-mark:after{content:'';width:12px;height:12px;background:var(--blue);border-radius:50%}.spacer{flex:1;min-height:32px}.action-footer{flex:none;padding:16px 18px;border-top:1px solid var(--line);background:#fff}.primary{min-height:68px;width:100%;padding:16px;border:0;border-radius:7px;color:#fff;background:var(--blue);font-size:19px;line-height:1.4;font-weight:600}.primary:hover{background:var(--blue-deep)}.primary:active{background:var(--blue-deep)}
:lang(en){font-family:Arial,Helvetica,sans-serif}:lang(th){font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif}h1:lang(th){letter-spacing:0;line-height:1.35}.eyebrow:lang(th),.lead:lang(th){line-height:1.6}.language-copy strong:lang(th){letter-spacing:0;line-height:1.5}.primary:lang(th){line-height:1.6}
.splash{display:grid;place-items:center;background:linear-gradient(180deg,#fff 0%,#f7faff 100%)}.splash-link{display:grid;place-items:center;min-height:100px;padding:20px;text-decoration:none;border-radius:7px;color:var(--blue)}.splash-brand{font-size:54px;letter-spacing:-2.475px;animation:brand-in 420ms cubic-bezier(.2,.7,.3,1) both}.splash-brand i{width:13.5px;height:13.5px;margin-left:6.75px;animation:accent-in 260ms ease-out 120ms both}.splash.still .splash-brand,.splash.still .splash-brand i,.splash.reduced .splash-brand,.splash.reduced .splash-brand i{animation:none}
@keyframes brand-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@keyframes accent-in{from{opacity:0}to{opacity:1}}
@media(max-width:460px){body{padding:0}.frame{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.statusbar{height:calc(28px + env(safe-area-inset-top));padding-top:calc(7px + env(safe-area-inset-top))}.action-footer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}.splash{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}}
@media(max-width:350px){.brandbar,.page-hero,.action-footer{padding-left:14px;padding-right:14px}.language-list{margin-left:14px;margin-right:14px}.language-row{padding-left:14px;padding-right:16px;gap:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style></head><body data-state="" data-review="0"><div class="frame" id="frame"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="phone-status">5G <i></i></span></div><main class="app"><header class="brandbar"><span class="brand" lang="en">Rounds<i aria-hidden="true"></i></span></header><div class="content"><header class="page-hero"><p class="eyebrow" id="eyebrow">เริ่มต้นใช้งาน</p><h1 id="pageTitle">เลือกภาษา</h1><p class="lead" id="lead">เปลี่ยนได้ภายหลังในโปรไฟล์</p></header><div class="language-list" id="languageList" role="radiogroup" aria-label="ภาษาของแอป"><button class="language-row selected" id="thRow" type="button" role="radio" data-language="th" aria-checked="true" tabindex="0"><span class="language-copy"><strong lang="th">ไทย</strong><span lang="en">Thai</span></span><span class="radio-mark" aria-hidden="true"></span></button><button class="language-row" id="enRow" type="button" role="radio" data-language="en" aria-checked="false" tabindex="-1"><span class="language-copy"><strong lang="en">English</strong><span lang="th">อังกฤษ</span></span><span class="radio-mark" aria-hidden="true"></span></button></div><div class="spacer" aria-hidden="true"></div></div><footer class="action-footer"><button class="primary" id="continueBtn" type="button">ดำเนินการต่อ</button></footer></main></div><script>(()=>{'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const review=document.body.dataset.review==='1'||params.get('review')==='1';
const state=review?(document.body.dataset.state||params.get('state')||'thai'):'';
const rows=[...document.querySelectorAll('[data-language]')];
const copy={
 th:{title:'เลือกภาษา',lead:'เปลี่ยนได้ภายหลังในโปรไฟล์',eyebrow:'เริ่มต้นใช้งาน',button:'ดำเนินการต่อ',group:'ภาษาของแอป'},
 en:{title:'Choose your language',lead:'Change it later in Profile.',eyebrow:'Get started',button:'Continue in English',group:'App language'}
};
function savedLanguage(){try{return localStorage.getItem('rounds.language')}catch(_){return null}}
let selected=review?(state==='english'?'en':'th'):(savedLanguage()==='en'?'en':'th');
function render(){
 const c=copy[selected];document.documentElement.lang=selected;
 document.title=selected==='th'?'Rounds — เลือกภาษา':'Rounds — Choose your language';
 $('pageTitle').textContent=c.title;$('lead').textContent=c.lead;$('eyebrow').textContent=c.eyebrow;$('continueBtn').textContent=c.button;
 $('languageList').setAttribute('aria-label',c.group);
 rows.forEach(row=>{const on=row.dataset.language===selected;row.classList.toggle('selected',on);row.setAttribute('aria-checked',String(on));row.tabIndex=on?0:-1;});
}
function select(row,focus=false){selected=row.dataset.language;render();if(focus)row.focus();}
rows.forEach((row,i)=>{
 row.addEventListener('click',()=>select(row));
 row.addEventListener('keydown',event=>{
  const key=event.key;let next;
  if(key==='ArrowDown'||key==='ArrowRight')next=(i+1)%rows.length;
  else if(key==='ArrowUp'||key==='ArrowLeft')next=(i-1+rows.length)%rows.length;
  else if(key==='Home')next=0;else if(key==='End')next=rows.length-1;else return;
  event.preventDefault();select(rows[next],true);
 });
});
$('continueBtn').addEventListener('click',()=>{
 const href='ROUNDS-A02-A05-DRIVER-ENTRY-FLOW-v6-10OF10.html?lang='+selected;
 if(review&&parent!==window){parent.postMessage({type:'rounds-26-language-preview',language:selected},'*');return;}
 // A real first-run choice is local and usable offline. No account or role state is changed.
 // The query carries the choice onward even if this browser cannot store preferences.
 if(!review){try{localStorage.setItem('rounds.language',selected)}catch(_){}}
 location.href=href;
});
render();
})();
</script></body></html>
