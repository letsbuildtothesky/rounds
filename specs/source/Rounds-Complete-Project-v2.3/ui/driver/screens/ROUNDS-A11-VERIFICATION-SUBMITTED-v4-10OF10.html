/* Rounds driver — shared design tokens, style guide v1. */
:root {
  --blue: #1754a6;
  --blue-deep: #14488d;
  --blue-soft: #edf4fd;
  --orange: #ff6420;
  --orange-soft: #fff2e8;
  --ink: #17283f;
  --muted: #526278;
  --line: #dce4ed;
  --paper: #ffffff;
  --canvas: #e9edf2;
  --green: #167344;
  --green-soft: #edf7f1;
  --red: #a22f2f;
  --route-later: #668ebc;
  --care-ink: #98400f;
  --font-ui: Arial, Helvetica, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;

}

.sheet-copy{font-size:17px;line-height:1.45;color:var(--muted);margin:16px 0 22px}.sheet .primary{margin-top:20px;min-height:68px}.secondary{min-height:60px;width:100%;padding:12px 16px;background:white;color:var(--blue);border:1px solid #bacbdd;border-radius:7px;font-size:18px;line-height:1.35;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}.secondary:hover{background:var(--blue-soft)}.sheet .secondary{margin-top:10px;min-height:68px}.status-announcement{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:460px){body{padding:0}.frame{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.statusbar{height:calc(28px + env(safe-area-inset-top));padding-top:calc(7px + env(safe-area-inset-top))}.action-footer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}.sheet{bottom:calc(8px + env(safe-area-inset-bottom))}}

</style></head><body data-state="" data-review="0"><div class="frame" id="frame"><div class="statusbar" aria-hidden="true"><span>18:26</span><span class="phone-status">5G <i></i></span></div><main class="app" id="app"><header class="brandbar"><div class="brand">Rounds<i></i></div><span class="context">Network</span></header><p class="sample-note" id="sampleNotice">Preview · Sample application</p><div class="status-announcement" id="statusAnnouncement" role="status" aria-live="polite"></div><p class="connection-note" id="connectionNote" hidden>You’re offline</p><div class="content" id="content"><header class="submitted-hero"><div class="receipt-mark" aria-hidden="true"><span id="receiptCheck"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span><span id="receiptClock" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></div><h1 id="pageTitle" tabindex="-1">Verification submitted</h1><p class="lead" id="lead">We’ll notify you of the result.</p></header><dl class="state-panel" aria-label="Verification status"><div class="state-row"><dt>Application</dt><dd id="applicationState" class="received">Received</dd></div><div class="state-row"><dt>Network access</dt><dd id="accessState" class="access-state">In review</dd></div></dl><div class="spacer" aria-hidden="true"></div></div><footer class="action-footer"><button class="primary" id="primary">Go to Home</button></footer></main><div class="panel-backdrop" id="backdrop" hidden></div><section class="sheet" id="statusSheet" role="dialog" aria-modal="true" aria-labelledby="statusSheetTitle" hidden><div class="sheet-head"><h2 id="statusSheetTitle">Submission status preview</h2><button class="square" data-close-sheet aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><p class="sheet-copy">Choose a sample result.</p><button class="primary" data-result="received">Application received</button><button class="secondary" data-result="unknown">Still unconfirmed</button><button class="secondary" data-result="error">Couldn’t check</button><button class="cancel" data-close-sheet>Keep checking</button></section></div><script>(()=>{'use strict';
const $=id=>document.getElementById(id),app=$('app'),backdrop=$('backdrop');let activeSheet=null,returnFocus=null,onSheetClosed=()=>{},canCloseSheet=()=>true;
function focusable(s){return [...s.querySelectorAll('button:not([disabled]),a[href],textarea,input,select,[tabindex="0"]')].filter(el=>!el.closest('[hidden]'))}
function closeSheet(){if(!activeSheet||!canCloseSheet())return;const id=activeSheet.id;activeSheet.hidden=true;activeSheet=null;onSheetClosed(id);backdrop.hidden=true;app.inert=false;if(returnFocus&&!returnFocus.closest('[hidden]'))returnFocus.focus()}
function openSheet(id,trigger){if(!activeSheet)returnFocus=trigger;else{const previous=activeSheet.id;activeSheet.hidden=true;onSheetClosed(previous)}activeSheet=$(id);activeSheet.hidden=false;backdrop.hidden=false;app.inert=true;activeSheet.scrollTop=0;focusable(activeSheet)[0]?.focus()}
document.querySelectorAll('[data-close-sheet]').forEach(b=>b.addEventListener('click',closeSheet));backdrop.addEventListener('click',closeSheet);document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeSheet()}if(e.key==='Tab'){const items=focusable(s),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}}));

const params=new URLSearchParams(location.search),review=document.body.dataset.review==='1'||params.get('review')==='1',fixture=document.body.dataset.state||params.get('state')||'';
const offline=()=>params.get('offline')==='1'||fixture==='offline'||navigator.onLine===false;
function text(el,value){el.textContent=value}
function focusPage(){if($('content'))$('content').scrollTop=0;$('pageTitle')?.focus()}
function make(tag,cls,value){const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=value;return el}
function facts(id,rows){$(id).replaceChildren(...rows.map(([label,value,tone])=>{const row=make('div','fact');row.append(make('dt','',label),make('dd',tone||'',value));return row}))}
function duration(minutes){return Math.floor(minutes/60)+'h '+String(minutes%60).padStart(2,'0')+'m'}
if(review||document.body.dataset.standalone==='1')document.addEventListener('click',e=>{if(e.defaultPrevented)return;const a=e.target.closest('a[href]');if(a&&/^ROUNDS-/.test(a.getAttribute('href'))){e.preventDefault();parent.postMessage({type:'rounds-21-companion',href:a.getAttribute('href')},'*')}});

function navigateLocal(href){if(review||document.body.dataset.standalone==='1')parent.postMessage({type:'rounds-21-companion',href},'*');else location.href=href;}
// Design samples only. No evidence upload, approval or availability change occurs.
const initial=['received','offline','unknown','error'].includes(fixture)?fixture:'received';
let receiptConfirmed=initial==='received'||initial==='offline';
let disconnected=initial==='offline'||navigator.onLine===false,reviewFresh=!disconnected;
let failed=initial==='error';
function render(){
 if(navigator.onLine===false){disconnected=true;reviewFresh=false;}
 const state=receiptConfirmed?'received':failed?'error':'unknown';
 $('frame').className='frame state-'+state+(disconnected?' is-offline':'');
 $('receiptCheck').hidden=!receiptConfirmed;$('receiptClock').hidden=receiptConfirmed;
 $('pageTitle').textContent=receiptConfirmed?'Verification submitted':failed?'Couldn’t check':'Check submission';
 $('lead').textContent=receiptConfirmed?'We’ll notify you of the result.':disconnected?'Reconnect to confirm your submission.':failed?'Your submission is still unconfirmed.':'Your submission isn’t confirmed yet.';
 $('applicationState').textContent=receiptConfirmed?'Received':'Not confirmed';
 $('applicationState').className=receiptConfirmed?'received':'unconfirmed';
 $('accessState').textContent=receiptConfirmed?(reviewFresh?'In review':'Check status'):'Not available';
 $('connectionNote').hidden=!disconnected;
 $('primary').textContent=receiptConfirmed?'Go to Home':'Check status';
 $('primary').disabled=!receiptConfirmed&&disconnected;
 document.querySelectorAll('[data-result]').forEach(b=>b.disabled=disconnected);
 $('statusAnnouncement').textContent=$('pageTitle').textContent+'. Application '+$('applicationState').textContent+'. Network access '+$('accessState').textContent+'.';
}
$('sampleNotice').hidden=review;
$('primary').addEventListener('click',()=>{
 if(navigator.onLine===false){disconnected=true;reviewFresh=false;render();}
 if(receiptConfirmed){
  const state=disconnected?'offline':reviewFresh?'pending':'unknown';
  navigateLocal('ROUNDS-B02-HOME-VERIFICATION-PENDING-v5-10OF10.html?state='+state);return;
 }
 if(disconnected){render();return;}
 openSheet('statusSheet',$('primary'));
});
document.querySelectorAll('[data-result]').forEach(b=>b.addEventListener('click',()=>{
 if(activeSheet?.id!=='statusSheet')return;
 if(disconnected||navigator.onLine===false){disconnected=true;closeSheet();render();$('pageTitle').focus();return;}
 const result=b.dataset.result;
 if(!['received','unknown','error'].includes(result))return;
 closeSheet();receiptConfirmed=result==='received';reviewFresh=receiptConfirmed;failed=result==='error';render();
}));
window.addEventListener('offline',()=>{
 const hadSheet=Boolean(activeSheet);disconnected=true;reviewFresh=false;if(activeSheet)closeSheet();render();
 if(hadSheet)$('pageTitle').focus();
});
window.addEventListener('online',()=>{
 if(!disconnected)return;
 disconnected=false;reviewFresh=false;render();
});
render();

})();</script></body></html>
