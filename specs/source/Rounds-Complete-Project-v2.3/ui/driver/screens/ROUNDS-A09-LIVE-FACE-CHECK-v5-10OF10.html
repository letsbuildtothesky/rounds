  if(ticket!==serial||document.hidden){releaseStream(candidate);return;}
  candidate.getVideoTracks().forEach(t=>t.addEventListener('ended',()=>{if(stream===candidate)cameraError('unavailable');}));
  phase='live';render();
 }catch(e){
  releaseStream(candidate);if(ticket!==serial)return;
  cameraError(['NotAllowedError','SecurityError'].includes(e.name)?'denied':e.name==='NotReadableError'?'busy':'unavailable');
 }
}
function takePhoto(){
 if(phase!=='live'||!video.videoWidth||!video.videoHeight)return;
 const ticket=serial,canvas=document.createElement('canvas');
 canvas.width=video.videoWidth;canvas.height=video.videoHeight;
 try{
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('No canvas');
  ctx.drawImage(video,0,0);phase='capturing';render();
  canvas.toBlob(blob=>{
   if(ticket!==serial)return;
   if(!blob){cameraError('capture');return;}
   const next=URL.createObjectURL(blob);clearPhoto();photoURL=next;$('snapshot').src=next;
   stopCamera();phase='captured';render();focusPage();
  },'image/jpeg',.9);
 }catch(_){cameraError('capture');}
}
