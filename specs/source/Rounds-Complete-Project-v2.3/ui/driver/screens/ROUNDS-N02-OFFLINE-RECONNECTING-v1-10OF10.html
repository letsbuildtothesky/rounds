 $('headerState').textContent=connection==='online'?'Online':connection==='offline'?'Offline':connection==='checking'||busy?'Checking':'Not checked';
 $('headerState').classList.toggle('good',connection==='online');
 $('queueTitle').textContent=c.unsafe.length?'Needs attention':c.pending.length?'Saved work':c.items.length?'Received by Rounds':'Saved work';
 const rows=[];
 for(const i of c.items){
  let record=queueNodes.get(i.id);
  if(!record){
   const row=make('button','queue-row');row.setAttribute('aria-haspopup','dialog');
   const symbol=make('span'),copy=make('span'),title=make('strong'),status=make('small'),end=make('span');
   copy.append(title,status);end.innerHTML=ICONS.chevron;row.append(symbol,copy,end);
   row.addEventListener('click',()=>openItem(i.id,row));record={row,symbol,title,status};queueNodes.set(i.id,record);
  }
  record.symbol.innerHTML=ICONS[i.kind==='proof'?'photo':'message'];record.title.textContent=i.title;record.status.textContent=itemLabel(i);
  record.status.className=i.state==='sent'?'good':'';rows.push(record.row);
 }
 const current=[...$('queueRows').children];
 if(current.length!==rows.length||current.some((node,i)=>node!==rows[i]))$('queueRows').replaceChildren(...rows);
 $('emptyQueue').hidden=c.items.length>0;$('emptyQueue').textContent=snapshot?'No items waiting to send.':'Saved work hasn’t been checked.';
 $('roundName').textContent=snapshot?.round?'Round '+snapshot.round.id+' · '+snapshot.round.merchant:'Current Round';
 $('roundSaved').textContent=snapshot?.round?.cached?'Saved on phone'+(snapshot.round.savedAt?' · '+snapshot.round.savedAt:''):'Saved route not checked';
 const unsafe=c.unsafe.length>0;
 $('primary').textContent=unsafe?'Review unsaved item':busy?'Checking connection…':c.uploading?'Check upload status':c.pending.length||!snapshot?'Retry connection':'Return to Round';
 $('primary').disabled=busy;
 $('secondary').textContent=c.pending.length||!snapshot?'Return to Round':'Check connection';
 $('secondary').hidden=unsafe;
 $('queueNote').textContent=c.unsafe.length?'Unsaved items need attention before you leave.':c.pending.length?'Items stay here until Rounds confirms receipt.':'';
 $('queueNote').hidden=true;
 if(activeSheet?.id==='itemSheet'&&selectedId)updateDetail();
}
function updateDetail(){
 const i=snapshot?.items.find(x=>x.id===selectedId);if(!i){closeSheet();return;}
 $('itemTitle').textContent=i.title;$('itemContext').textContent=i.context;
 $('itemState').textContent=itemLabel(i);$('itemState').classList.toggle('good',i.state==='sent');
 $('itemCopy').hidden=i.state==='sent';$('itemCopy').textContent=i.state==='sent'?'':
  i.state==='save_failed'?'This item has no confirmed local copy. Keep this screen open and retry saving.':
  i.kind==='proof'?'Saved on this phone. Delivery evidence is pending on Rounds.':'Saved on this phone.';
 $('retryItem').hidden=i.state==='sent';$('retryItem').disabled=busy;
 $('retryItem').textContent=i.state==='save_failed'?'Retry saving':i.state==='uploading'?'Check status':'Retry sending';
}
function openItem(id,trigger){selectedId=id;updateDetail();openSheet('itemSheet',trigger);}
function goRound(){
 serial++;
 const ctx=params.get('context')==='network'?'network':'team';
 const file=params.get('from')==='home'?(ctx==='network'?'ROUNDS-B03-HOME-NETWORK-AVAILABLE-v8-10OF10.html':'ROUNDS-B01-TEAM-DRIVER-HOME-v4-10OF10.html'):'ROUNDS-E01-ACTIVE-ROUND-OVERVIEW-v5-10OF10.html';
 const href=file+'?context='+ctx+(snapshot?.connection==='offline'?'&offline=1':'');
 navigateLocal(href);
}
function showError(message){
 $('syncError').textContent=message;$('syncError').hidden=false;
 if(activeSheet?.id==='itemSheet'){$('itemError').textContent=message;$('itemError').hidden=false;}
}
async function refresh(action='read',itemId=null){
 if(busy)return;
 if(demo){
  previewPending=true;previewAction=action;$('previewSheetTitle').textContent=action==='save'?'Save preview':'Connection preview';
  $('previewCopy').textContent='Choose a sample result. No work is sent.';
  $('previewSaved').hidden=action!=='save';$('previewSent').hidden=action==='save';$('previewPartial').hidden=action==='save';
  openSheet('previewSheet',activeSheet?$('retryItem'):$('primary'));return;
 }
 const n=++serial;busy=true;$('syncError').hidden=true;$('itemError').hidden=true;render();
 try{
  let raw;
  if(action==='save'){
   if(typeof bridge.retryLocalSave!=='function')throw Error('save unavailable');
   raw=await bridge.retryLocalSave(itemId);
  }else if(action==='retry'){
   if(typeof bridge.retry!=='function')throw Error('retry unavailable');
   raw=await bridge.retry(itemId);
  }else{
   if(typeof bridge.getSnapshot!=='function')throw Error('read unavailable');
   raw=await bridge.getSnapshot();
  }
  if(n!==serial)return;
  snapshot=validate(raw);
 }catch(_){if(n!==serial)return;showError(action==='save'?'Still not saved. Keep this screen open and try again.':'Couldn’t check saved work. Try again.');}
 finally{if(n===serial){busy=false;render();}}
}
function previewResult(mode){
 if(!demo||!previewPending)return;previewPending=false;closeSheet();
 const saveFailed=previewAction==='save'&&mode!=='saved';
 snapshot=validate(sample(saveFailed?'save-failed':mode==='saved'?'offline':mode));$('syncError').hidden=true;render();focusPage();
}
['Offline','Partial','Sent','Failed','Saved'].forEach((name,i)=>$('preview'+name).addEventListener('click',()=>previewResult(['offline','partial','synced','failed','saved'][i])));
$('primary').addEventListener('click',()=>{
 const c=counts();
 if(c.unsafe.length)return openItem(c.unsafe[0].id,$('primary'));
 if(snapshot&&!c.pending.length&&!busy)return goRound();
 refresh(c.uploading?'read':'retry');
});
$('secondary').addEventListener('click',()=>{if(counts().pending.length||!snapshot)goRound();else refresh();});
$('retryItem').addEventListener('click',()=>{
 const i=snapshot?.items.find(x=>x.id===selectedId);if(i)refresh(i.state==='save_failed'?'save':i.state==='uploading'?'read':'retry',i.id);
});
onSheetClosed=id=>{if(id==='previewSheet')previewPending=false;};
// A network event alone never acknowledges a queued item and never invokes retry/send.
window.addEventListener('online',()=>{if(!demo&&!busy)refresh();});
window.addEventListener('offline',()=>{if(demo)return;serial++;busy=false;if(snapshot){snapshot={...snapshot,connection:'offline'};render();}});
window.addEventListener('pagehide',()=>{serial++;busy=false;});
$('sampleNotice').hidden=review||!demo;
if(demo){snapshot=validate(sample(fixture||'offline'));render();}else{render();refresh();}

})();</script></body></html>
