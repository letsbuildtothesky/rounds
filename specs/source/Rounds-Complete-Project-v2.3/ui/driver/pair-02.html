<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rounds — Refresh 02 · Driver navigation and pickup</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#17283f;font:15px Arial;padding:28px 20px}header{max-width:822px;margin:0 auto 24px}h1{font-size:23px;letter-spacing:-.7px;margin:0}p{font-size:13px;color:#526278;line-height:1.5;margin:8px 0 0}.screens{display:grid;grid-template-columns:393px 393px;gap:36px;justify-content:center}.screen-head{min-height:62px;font-size:14px;color:#334c66}b{font-weight:600}.mode{display:flex;gap:6px;margin-top:10px}.mode button{padding:7px 12px;border:1px solid #bacbdd;border-radius:4px;font:13px Arial;color:#1754a6;background:white;cursor:pointer;min-height:34px}.mode button.active{color:white;background:#1754a6;border-color:#1754a6}iframe{width:393px;height:852px;background:white;border:1px solid #c9d3de;border-radius:20px;display:block;margin-top:12px}.screen-head .note{display:block;margin-top:13px;font-size:13px;color:#526278}@media(max-width:880px){body{padding:22px 12px}.screens{grid-template-columns:minmax(0,393px);gap:30px}header{max-width:393px}iframe{width:100%}}@media(max-width:460px){iframe{height:800px;border-radius:12px}}</style></head><body><header><h1>Rounds / Driver · 02</h1><p>Navigation + pickup confirmation. Fixed route preview; no live GPS.<br>Saved real maps included. Internet enables pan and zoom.</p></header><main class="screens"><section><div class="screen-head"><b>01 / Navigate to pickup</b><div class="mode"><button id="onWay" class="active" aria-pressed="true">On the way</button><button id="nearPickup" aria-pressed="false">Near pickup</button></div></div><iframe id="navFrame" title="Navigate to pickup"></iframe></section><section><div class="screen-head"><b>02 / Confirm pickup</b><span class="note">Tap each package to collect it.</span></div><iframe id="pickupFrame" title="Confirm pickup"></iframe></section></main><script>const nav=document.getElementById('navFrame'),pickup=document.getElementById('pickupFrame');pickup.src="screens/ROUNDS-D03-D04-PICKUP-CONFIRM-v6-10OF10.html";const navFile="screens/ROUNDS-D01-NAVIGATE-TO-PICKUP-v5-10OF10.html";function show(near){nav.src=navFile+(near?'?state=near':'');for(const [id,on] of [['onWay',!near],['nearPickup',near]]){const b=document.getElementById(id);b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))}}document.getElementById('onWay').onclick=()=>show(false);document.getElementById('nearPickup').onclick=()=>show(true);show(false);</script></body></html>
