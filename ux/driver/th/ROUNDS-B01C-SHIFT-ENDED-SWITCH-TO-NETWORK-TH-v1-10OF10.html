<script>
  const networkSwitch = document.getElementById('networkSwitch');
  const availabilityState = document.getElementById('availabilityState');
  let navigating = false;

  networkSwitch.addEventListener('click', () => {
    if(navigating) return;
    const on = !networkSwitch.classList.contains('on');
    networkSwitch.classList.toggle('on', on);
    networkSwitch.setAttribute('aria-pressed', String(on));
    availabilityState.textContent = on ? 'พร้อมรับงาน Network' : 'ยังไม่เปิดรับงาน Network';

    if(on){
      navigating = true;
      setTimeout(() => {
        window.location.href = 'ROUNDS-B03-HOME-NETWORK-AVAILABLE-TH-v1-10OF10.html';
      }, 320);
    }
  });
</script>
