  const team=`<div class="work-line"><div><b>UrbanFlowers</b><span>คนขับทีม · สุขุมวิท 39</span></div><div class="work-state">ใช้งานอยู่</div></div>`;
  const network=`<div class="work-line"><div><b>Rounds Network</b><span>คนขับอิสระ</span></div><div class="work-state">อนุมัติแล้ว</div></div>`;
  holder.innerHTML=context==='team'?team:context==='network'?network:team+network;
  document.querySelectorAll('.network-only').forEach(el=>el.style.display=context==='team'?'none':'grid');
  const home=document.getElementById('homeNav'),jobs=document.getElementById('jobsNav'),role=document.getElementById('roleNav'),label=document.getElementById('roleLabel'),icon=document.getElementById('roleIcon');
  if(context==='network'){
    home.href='ROUNDS-B03-HOME-NETWORK-AVAILABLE-TH-v1-10OF10.html';jobs.href='ROUNDS-J01-MY-ROUNDS-TH-v1-10OF10.html?context=network';role.href='ROUNDS-K01-EARNINGS-TH-v1-10OF10.html';label.textContent='รายได้';icon.innerHTML='<path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7H14.5a3.5 3.5 0 0 1 0 7H6"/>';document.getElementById('notificationsTop').href='ROUNDS-M01-NOTIFICATIONS-TH-v1-10OF10.html?context=network';document.getElementById('notificationsRow').href='ROUNDS-M01-NOTIFICATIONS-TH-v1-10OF10.html?context=network';
  }else{jobs.href='ROUNDS-J01-MY-ROUNDS-TH-v1-10OF10.html?context=team';document.getElementById('notificationsTop').href='ROUNDS-M01-NOTIFICATIONS-TH-v1-10OF10.html?context=team';document.getElementById('notificationsRow').href='ROUNDS-M01-NOTIFICATIONS-TH-v1-10OF10.html?context=team'}
}
renderContext();updateIdentity();updateDriverRows();

document.getElementById('editIdentity').onclick=()=>openSheet({title:'แก้ไขโปรไฟล์',html:`<div class="field"><label>ชื่อ</label><input id="nameInput" value="${driverName.replace(/"/g,'&quot;')}"></div><div class="field"><label>เบอร์โทร</label><input id="phoneInput" value="${driverPhone.replace(/"/g,'&quot;')}"></div><button class="sheet-primary" id="saveIdentity">บันทึก</button>`});
document.addEventListener('click',e=>{if(e.target.id==='saveIdentity'){driverName=document.getElementById('nameInput').value.trim()||driverName;driverPhone=document.getElementById('phoneInput').value.trim()||driverPhone;updateIdentity();closeSheet();showToast('อัปเดตโปรไฟล์แล้ว')}});

const vehicles=['มอเตอร์ไซค์พร้อมกล่อง','ตุ๊กตุ๊ก','รถยนต์','รถกระบะ','รถตู้'];
document.getElementById('vehicleRow').onclick=()=>openSheet({kicker:'ยานพาหนะ',title:vehicle,sub:plate,html:`<div class="sheet-list">${vehicles.map(v=>`<button class="sheet-choice ${v===vehicle?'selected':''}" data-vehicle="${v}"><b>${v}</b><span>${v===vehicle?'ใช้อยู่':'เลือก'}</span></button>`).join('')}</div>`});
document.addEventListener('click',e=>{const b=e.target.closest('[data-vehicle]');if(!b)return;vehicle=b.dataset.vehicle;updateDriverRows();closeSheet();showToast('อัปเดตยานพาหนะแล้ว')});

document.getElementById('documentsRow').onclick=()=>openSheet({kicker:'การยืนยัน',title:'ยืนยันแล้ว',sub:'ยืนยันบัญชีคนขับเรียบร้อย',html:`<div class="sheet-list"><div class="sheet-row"><span>สถานะ</span><b style="color:var(--green)">ยืนยันแล้ว</b></div><div class="sheet-row"><span>คนขับ</span><b>${driverName}</b></div></div><button class="sheet-primary" id="doneSheet">เสร็จ</button>`});

document.getElementById('payoutRow').onclick=()=>openSheet({kicker:'การรับเงิน Network',title:'วิธีรับเงิน',sub:payout,html:`<div class="sheet-list"><button class="sheet-choice ${payout.startsWith('PromptPay')?'selected':''}" data-payout="PromptPay · •••• 4821"><b>PromptPay</b><span>${payout.startsWith('PromptPay')?'ใช้อยู่':'เลือก'}</span></button><button class="sheet-choice ${payout.startsWith('บัญชี')?'selected':''}" data-payout="บัญชีธนาคาร · •••• 2048"><b>บัญชีธนาคาร</b><span>${payout.startsWith('บัญชี')?'ใช้อยู่':'เลือก'}</span></button></div>`});
document.addEventListener('click',e=>{const b=e.target.closest('[data-payout]');if(!b)return;payout=b.dataset.payout;updateDriverRows();closeSheet();showToast('อัปเดตวิธีรับเงินแล้ว')});

document.getElementById('networkPrefsRow').onclick=()=>openSheet({kicker:'Network',title:'การติดต่อจากร้านค้า',sub:'การตั้งค่า Network',html:`<div class="sheet-list"><div class="toggle-row"><div class="toggle-copy"><b>ร้านค้าที่เคยรับงานส่งข้อความได้</b><span>เฉพาะร้านค้าที่รู้จักหรือเคยรับงาน</span></div><button class="switch ${merchantContact?'on':''}" id="merchantContactSwitch" aria-label="เปิดหรือปิดข้อความจากร้านค้า"><i></i></button></div><div class="toggle-row"><div class="toggle-copy"><b>ขอเช็กเวลาว่าง</b><span>อนุญาตคำขอเช็กเวลาว่างจากร้านค้า</span></div><button class="switch ${askAvailability?'on':''}" id="availabilitySwitch" aria-label="เปิดหรือปิดคำขอเวลาว่าง"><i></i></button></div></div><button class="sheet-primary" id="saveNetworkPrefs">เสร็จ</button>`});
document.addEventListener('click',e=>{if(e.target.closest('#merchantContactSwitch')){merchantContact=!merchantContact;e.target.closest('#merchantContactSwitch').classList.toggle('on',merchantContact)}if(e.target.closest('#availabilitySwitch')){askAvailability=!askAvailability;e.target.closest('#availabilitySwitch').classList.toggle('on',askAvailability)}if(e.target.id==='saveNetworkPrefs'){updateDriverRows();closeSheet();showToast('บันทึกการตั้งค่า Network แล้ว')}});

document.getElementById('languageRow').onclick=()=>openSheet({kicker:'ภาษา',title:'ภาษาในแอป',html:`<div class="sheet-list"><button class="sheet-choice ${language==='English'?'selected':''}" data-language="English"><b>English</b><span>${language==='English'?'เลือกแล้ว':'เลือก'}</span></button><button class="sheet-choice ${language==='ไทย'?'selected':''}" data-language="ไทย"><b>ไทย</b><span>${language==='ไทย'?'เลือกแล้ว':'เลือก'}</span></button></div>`});
document.addEventListener('click',e=>{const b=e.target.closest('[data-language]');if(!b)return;language=b.dataset.language;saveLanguagePreference(language==='ไทย'?'th':'en');updateDriverRows();closeSheet();showToast('บันทึกภาษาแล้ว')});

document.getElementById('supportRow').onclick=()=>openSheet({kicker:'ความช่วยเหลือ',title:'ติดต่อฝ่ายจัดงาน',html:`<div class="sheet-list"><a class="sheet-choice" href="ROUNDS-H01-OPERATOR-CHAT-TH-v1-10OF10.html" style="text-decoration:none;color:inherit"><b>แชตฝ่ายจัดงาน</b><span>เปิดแชต</span></a><a class="sheet-choice" href="ROUNDS-H02-CALL-CONTACT-TH-v1-10OF10.html" style="text-decoration:none;color:inherit"><b>โทรฝ่ายจัดงาน</b><span>โทรผ่าน Rounds</span></a></div>`});
document.getElementById('signOutRow').onclick=()=>openSheet({kicker:'บัญชี',title:'ออกจากระบบ?',sub:'จะกลับไปหน้าลงชื่อเข้าใช้คนขับ',html:`<button class="sheet-danger" id="confirmSignOut">ออกจากระบบ</button><button class="sheet-secondary" id="cancelSignOut">ยกเลิก</button>`});
document.addEventListener('click',e=>{if(e.target.id==='confirmSignOut')location.href='ROUNDS-A02-A05-DRIVER-ENTRY-FLOW-TH-v2-10OF10.html';if(e.target.id==='cancelSignOut'||e.target.id==='doneSheet')closeSheet()});
</script>
