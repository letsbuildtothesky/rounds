<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rounds — B01B ได้รับรอบแล้ว · Thai-first v1</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css');
  :root{
    --canvas:#eef1f4;
    --paper:#ffffff;
    --ink:#172238;
    --ink-2:#3d4a5d;
    --muted:#748094;
    --line:#e1e6ea;
    --line-2:#cbd4dc;
    --orange:#ff6420;
    --orange-soft:#fff3ec;
    --green:#168b50;
    --map:#f3f6f7;
    --road:#ffffff;
    --road-edge:#e1e6e9;
    --blue:#2f6fbd;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;min-height:100%;background:var(--canvas);color:var(--ink);
    font-family:'LINE Seed Sans TH',Tahoma,'Noto Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,a{font:inherit}
  body{padding:28px}

  .frame{
    width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;
    border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14);
  }

  .statusbar{
    height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;
    font-size:12px;font-weight:700;background:#fff;position:relative;z-index:30;
  }
  .sb-right{display:flex;align-items:center;gap:6px}
  .signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}
  .signal i{display:block;width:2px;background:currentColor;border-radius:1px}
  .signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}
  .battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}
  .battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
  .battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}

  .topbar{
    height:56px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;background:#fff;position:relative;z-index:30;
  }
  .brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}
  .brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}
  .icon-btn{
    width:40px;height:40px;border:1px solid transparent;background:#fff;color:var(--ink-2);display:grid;
    place-items:center;border-radius:7px;cursor:pointer;text-decoration:none;
  }
  .icon-btn:hover{border-color:var(--line)}
  .icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .body{position:absolute;inset:84px 0 76px;background:#fff;overflow:hidden;display:flex;flex-direction:column}

  .hero{padding:20px 20px 19px;border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto}
  .state-line{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:820;color:var(--orange);margin-bottom:9px}
  .state-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .hero h1{margin:0;font-size:31px;line-height:1.01;letter-spacing:-.055em;font-weight:790}
  .pickup-area{margin-top:8px;font-size:14px;line-height:1.25;color:var(--muted);font-weight:650}

  .pickup-summary{
    padding:17px 20px 16px;border-bottom:1px solid var(--line);display:block;flex:0 0 auto;
  }
  .summary-copy{min-width:0}
  .eyebrow{font-size:11.5px;line-height:1;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .merchant{font-size:20px;line-height:1.08;font-weight:820;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .metric-pair{display:flex;align-items:flex-end;gap:24px;margin-top:12px;flex:0 0 auto}
  .metric{text-align:left}
  .metric strong{display:block;font-size:22px;line-height:1;font-weight:840;letter-spacing:-.04em}
  .metric span{display:block;margin-top:5px;font-size:11.5px;line-height:1;color:var(--muted);font-weight:690}

  .map-wrap{position:relative;flex:1 1 auto;min-height:226px;background:var(--map);overflow:hidden;border-bottom:1px solid var(--line)}
  .map{
    position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0)),
      var(--map);
  }
  .block{position:absolute;background:#e8edef;border-radius:5px;opacity:.75}
  .park{position:absolute;background:#e4f0e7;border-radius:5px}
  .road{position:absolute;background:var(--road);box-shadow:0 0 0 1px var(--road-edge);border-radius:999px;transform-origin:center}
  .road.major{height:12px}.road.minor{height:7px}
  .route-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .route-svg path.route-shadow{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .route-svg path.route-main{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .current{
    position:absolute;left:75px;top:123px;width:18px;height:18px;border-radius:50%;background:var(--blue);
    border:4px solid #fff;box-shadow:0 0 0 1px rgba(47,111,189,.25),0 2px 8px rgba(23,34,56,.16);
  }
  .pickup-pin{
    position:absolute;right:71px;top:48px;width:32px;height:32px;border-radius:50%;background:var(--orange);
    border:4px solid #fff;box-shadow:0 0 0 1px rgba(255,100,32,.24),0 5px 12px rgba(23,34,56,.14);
    display:grid;place-items:center;color:#fff;
  }
  .pickup-pin svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .pickup-label{
    position:absolute;right:20px;top:88px;text-align:right;color:var(--ink);font-size:13px;font-weight:820;line-height:1.1;
  }
  .pickup-label span{display:block;margin-top:4px;color:var(--muted);font-size:11.5px;font-weight:680}
  .me-label{position:absolute;left:50px;top:149px;font-size:11.5px;color:var(--muted);font-weight:720}


  .round-context{
    min-height:54px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;
    font-size:13px;color:var(--ink-2);font-weight:730;
  }
  .round-context .primary-context{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .round-context .handling{color:var(--muted);font-weight:690;white-space:nowrap}

  .task-footer{padding:13px 20px 14px;background:#fff;flex:0 0 auto}
  .task-utility{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;min-height:40px}
  .dispatch-copy{min-width:0}
  .dispatch-label{font-size:11.5px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .dispatch-name{font-size:14px;line-height:1.1;font-weight:780}
  .dispatch-actions{display:flex;gap:7px}
  .utility{
    width:40px;height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink-2);
    display:grid;place-items:center;text-decoration:none;
  }
  .utility:hover{border-color:var(--line-2);background:#fafbfc}
  .utility svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .primary{
    min-height:62px;width:100%;border:0;border-radius:7px;background:var(--ink);color:#fff;text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:820;letter-spacing:-.01em;
  }
  .primary:hover{background:#202d45}
  .primary svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .bottomnav{
    position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px 9px;z-index:40;
  }
  .nav-item{
    color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;font-size:11.5px;font-weight:720;border:0;background:#fff;cursor:pointer;
  }
  .nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav-item.active{color:var(--orange)}

  /* Thai-first composition */
  .statusbar,.brand{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .hero{padding:22px 20px 20px}
  .state-line{font-size:13.5px;line-height:1.45;font-weight:730;letter-spacing:0;margin-bottom:7px}
  .hero h1{font-size:39px;line-height:1.12;letter-spacing:0;font-weight:800}
  .pickup-area{margin-top:5px;font-size:14px;line-height:1.45;font-weight:560}
  .eyebrow{font-size:12px;line-height:1.4;font-weight:700;letter-spacing:0;text-transform:none;margin-bottom:5px}
  .merchant{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:19px;letter-spacing:-.02em;overflow:visible;text-overflow:clip}
  .metric strong{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:19px;letter-spacing:-.025em;white-space:nowrap}
  .metric span{margin-top:4px;font-size:11.2px;line-height:1.35;font-weight:580;white-space:nowrap}
  .round-context{font-size:12.5px;line-height:1.35;font-weight:610}
  .round-context .handling{font-weight:560}
  .dispatch-label{font-size:11.8px;line-height:1.4;font-weight:690;letter-spacing:0;text-transform:none;margin-bottom:3px}
  .dispatch-name{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:14px;letter-spacing:-.01em}
  .primary{font-size:16px;line-height:1.35;font-weight:730;letter-spacing:0}
  .nav-item{font-size:10.8px;line-height:1.3;font-weight:620;white-space:nowrap}
  @media(max-width:340px){
    .hero{padding:19px 16px 18px}.state-line{font-size:12.7px}.hero h1{font-size:35px;line-height:1.14}.pickup-area{font-size:13px}
    .pickup-summary{padding-left:16px;padding-right:16px}.metric-pair{gap:24px;margin-top:11px}.merchant{font-size:18px}.metric strong{font-size:18px}.metric span{font-size:10.7px}
    .round-context{padding-left:16px;padding-right:16px;font-size:11.7px}.task-footer{padding-left:16px;padding-right:16px}.primary{font-size:15px}.nav-item{font-size:10.1px}
  }
  @media(max-width:460px){
    body{padding:0;background:#fff}
    .frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}
  }
</style>
</head>
