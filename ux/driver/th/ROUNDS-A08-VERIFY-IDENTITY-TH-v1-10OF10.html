<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rounds — A08 ยืนยันตัวตน · Thai-first v1</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css');
:root{--canvas:#eef1f4;--paper:#fff;--ink:#172238;--ink2:#3d4a5d;--muted:#748094;--line:#e1e6ea;--line2:#cbd4dc;--orange:#ff6420;--green:#168b50}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:'LINE Seed Sans TH',Tahoma,'Noto Sans Thai',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid rgba(255,100,32,.16);outline-offset:2px}
body{padding:28px}.frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}
.statusbar{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:40}.sb-right{display:flex;align-items:center;gap:6px}.signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}.battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}
.top{height:68px;padding:0 20px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line)}.back{width:40px;height:40px;border:0;border-radius:7px;background:#fff;color:var(--ink);display:grid;place-items:center;margin-left:-7px}.back:active{background:#f6f8f9}.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.brand{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;align-items:flex-end;font-size:24px;line-height:1;font-weight:920;letter-spacing:-.055em}.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}.context{margin-left:auto;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:11.5px;line-height:1;font-weight:880;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.body{position:absolute;inset:96px 0 92px;padding:31px 20px 24px;overflow-y:auto;scrollbar-width:none}.body::-webkit-scrollbar{display:none}.eyebrow{font-size:12.5px;line-height:1.45;font-weight:800;letter-spacing:0;color:var(--orange);margin-bottom:10px}h1{margin:0;font-size:39px;line-height:1.14;font-weight:800;letter-spacing:0;max-width:345px}.lead{margin:11px 0 0;font-size:15.5px;line-height:1.55;font-weight:500;color:var(--ink2);max-width:335px}
.docs{margin-top:25px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.doc{padding:18px 0}.doc+.doc{border-top:1px solid var(--line)}.doc-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}.doc-head b{font-size:17px;line-height:1.35;font-weight:750;letter-spacing:0}.state{font-size:12.5px;line-height:1.35;font-weight:650;color:var(--muted)}.state.done{color:var(--green);font-weight:700}
.capture-shell{width:100%;height:154px;border:1px dashed var(--line2);border-radius:8px;background:#fafbfb;color:inherit;position:relative;overflow:hidden}.capture-shell.has-image{border-style:solid;border-color:#bfdacb;background:#f7fbf8}.capture{width:100%;height:100%;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}.capture:active{background:#f6f8f9}.capture-empty{display:flex;flex-direction:column;align-items:center;gap:7px}.capture-icon{width:42px;height:42px;display:grid;place-items:center;color:var(--orange)}.capture-icon svg{width:31px;height:31px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.capture-empty b{font-size:16px;line-height:1.4;font-weight:700;letter-spacing:0}.capture-empty span{font-size:12.5px;line-height:1.4;font-weight:500;color:var(--muted)}.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.capture-shell.has-image .preview{display:block}.capture-shell.has-image .capture-empty{display:none}.capture-overlay{position:absolute;left:10px;right:10px;bottom:10px;display:none;align-items:center;justify-content:space-between;gap:8px}.capture-shell.has-image .capture-overlay{display:flex}.captured{min-height:35px;padding:0 10px;border-radius:5px;background:rgba(22,139,80,.95);color:#fff;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}.captured svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.retake{min-height:35px;padding:0 12px;border:1px solid rgba(255,255,255,.75);border-radius:5px;background:rgba(255,255,255,.95);color:var(--ink);font-size:12.5px;font-weight:700}
.file{display:none}.footer{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.primary{width:100%;height:62px;border:0;border-radius:7px;background:#dce1e5;color:#9aa4ae;font-size:17px;font-weight:700;letter-spacing:0;cursor:default}.primary.ready{background:var(--ink);color:#fff;cursor:pointer}.primary.ready:active{transform:translateY(1px)}.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:8px;font-size:13.5px;line-height:1.45;font-weight:600;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:90}.toast.show{opacity:1;transform:none}
@media(max-width:520px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(max-width:340px){.top{padding-left:16px;padding-right:16px}.body{padding:26px 16px 20px}.eyebrow{margin-bottom:8px}h1{font-size:34px;line-height:1.16}.lead{font-size:14.5px;line-height:1.52;margin-top:9px}.docs{margin-top:19px}.doc{padding:14px 0}.doc-head{margin-bottom:8px}.doc-head b{font-size:15.5px}.state{font-size:11.8px}.capture-shell{height:124px}.capture-icon{width:35px;height:35px}.capture-icon svg{width:27px;height:27px}.capture-empty{gap:5px}.capture-empty b{font-size:14px}.capture-empty span{font-size:11.5px}.captured,.retake{font-size:11.8px;min-height:33px}.footer{padding-left:16px;padding-right:16px}.primary{height:58px}}
@media(max-height:720px){.body{padding-top:20px}h1{font-size:33px}.lead{font-size:13.8px;margin-top:8px}.docs{margin-top:16px}.doc{padding:11px 0}.doc-head{margin-bottom:6px}.capture-shell{height:106px}.capture-icon{width:31px;height:31px}.capture-icon svg{width:24px;height:24px}.capture-empty{gap:4px}.capture-empty b{font-size:13.5px}.capture-empty span{font-size:11px}.primary{height:56px}}
</style>
</head>
<body>
<div class="frame">
  <div class="statusbar"><div>10:48</div><div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><div>5G</div><div class="battery"><b></b></div></div></div>
  <header class="top"><button class="back" id="backBtn" aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><div class="brand">Rounds<span class="brand-dot"></span></div><div class="context">Network</div></header>
  <main class="body">
    <div class="eyebrow">สำหรับรับงาน Network</div><h1>ยืนยันตัวตน</h1><p class="lead">ถ่ายเอกสาร 2 รายการให้ชัด</p>
    <section class="docs">
      <div class="doc"><div class="doc-head"><b>บัตรประชาชน</b><span class="state" id="idState">ต้องใช้</span></div><div class="capture-shell" id="idShell"><button class="capture" id="idCapture" type="button"><img class="preview" id="idPreview" alt="ตัวอย่างบัตรประชาชน" /><span class="capture-empty"><span class="capture-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="11" r="2.5"/><path d="M13 9h5M13 12h5M6 16h12"/></svg></span><b>ถ่ายบัตรประชาชน</b><span>ใช้กล้องหรือเลือกรูปจากเครื่อง</span></span></button><span class="capture-overlay"><span class="captured"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>พร้อมแล้ว</span><button class="retake" type="button" data-retake="id">ถ่ายใหม่</button></span></div><input class="file" id="idFile" type="file" accept="image/*" capture="environment" /></div>
      <div class="doc"><div class="doc-head"><b>ใบขับขี่</b><span class="state" id="licenseState">ต้องใช้</span></div><div class="capture-shell" id="licenseShell"><button class="capture" id="licenseCapture" type="button"><img class="preview" id="licensePreview" alt="ตัวอย่างใบขับขี่" /><span class="capture-empty"><span class="capture-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h3M7 12h3M13 9h4M13 12h4M7 15h10"/></svg></span><b>ถ่ายใบขับขี่</b><span>ใช้กล้องหรือเลือกรูปจากเครื่อง</span></span></button><span class="capture-overlay"><span class="captured"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>พร้อมแล้ว</span><button class="retake" type="button" data-retake="license">ถ่ายใหม่</button></span></div><input class="file" id="licenseFile" type="file" accept="image/*" capture="environment" /></div>
    </section>
  </main>
  <footer class="footer"><button class="primary" id="continueBtn" type="button">ต่อไป</button></footer><div class="toast" id="toast"></div>
</div>
<script>
const items={id:{shell:document.getElementById('idShell'),capture:document.getElementById('idCapture'),file:document.getElementById('idFile'),preview:document.getElementById('idPreview'),state:document.getElementById('idState'),done:false},license:{shell:document.getElementById('licenseShell'),capture:document.getElementById('licenseCapture'),file:document.getElementById('licenseFile'),preview:document.getElementById('licensePreview'),state:document.getElementById('licenseState'),done:false}};const continueBtn=document.getElementById('continueBtn'),toast=document.getElementById('toast');
function flash(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),950)}function refresh(){continueBtn.classList.toggle('ready',items.id.done&&items.license.done)}function clearItem(key){const x=items[key];x.done=false;x.shell.classList.remove('has-image');x.state.textContent='ต้องใช้';x.state.classList.remove('done');x.preview.removeAttribute('src');x.file.value='';refresh()}
Object.entries(items).forEach(([key,x])=>{x.capture.addEventListener('click',e=>{if(e.target.closest('[data-retake]'))return;x.file.click()});x.file.addEventListener('change',()=>{const f=x.file.files&&x.file.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{x.preview.src=reader.result;x.shell.classList.add('has-image');x.state.textContent='พร้อมแล้ว';x.state.classList.add('done');x.done=true;refresh()};reader.readAsDataURL(f)})});document.querySelectorAll('[data-retake]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const key=btn.dataset.retake;clearItem(key);setTimeout(()=>items[key].file.click(),0)}));
continueBtn.addEventListener('click',()=>{if(!continueBtn.classList.contains('ready'))return;flash('บันทึกเอกสารแล้ว');setTimeout(()=>location.href='ROUNDS-A09-LIVE-FACE-CHECK-v5-10OF10.html?lang=th',420)});document.getElementById('backBtn').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='ROUNDS-A07-YOUR-VEHICLE-TH-v1-10OF10.html?context=network'});refresh();
</script>
</body>
</html>
