<script>
  const TOKEN='MAPBOX_TOKEN_REQUIRED';
  const STOP=[100.56875,13.72895];
  const START=[100.55385,13.73615];
  const NEAR=[100.5681,13.72945];
  const params=new URLSearchParams(location.search);
  const state=params.get('state')==='near'?'near':'enroute';
  const current=state==='near'?NEAR:START;
  const frame=document.getElementById('frame');
  const actionSheet=document.getElementById('actionSheet');
  const actionScrim=document.getElementById('actionScrim');
  const menuBtn=document.getElementById('menuBtn');
  const loadingNote=document.getElementById('loadingNote');

  if(state==='near'){
    frame.classList.add('near');
    document.getElementById('turnDistance').innerHTML='70 <small>ม.</small>';
    document.getElementById('turnText').textContent='ทางเข้า The Emporio Place ข้างหน้า';
    document.getElementById('dockKicker').textContent='ใกล้ถึงแล้ว · จุด 1 จาก 4';
    document.getElementById('dockPlace').textContent='ทางเข้าล็อบบี้ · Tower A';
    document.getElementById('eta').textContent='1 นาที';
    document.getElementById('distance').textContent='70 ม.';

  document.getElementById('arriveBtn').addEventListener('click',()=>location.href='ROUNDS-F01-F02-DROPOFF-HANDOFF-TH-v1-10OF10.html');

  function fallbackRoute(){return {type:'Feature',geometry:{type:'LineString',coordinates:[current,[100.5573,13.7344],[100.5614,13.7322],[100.5651,13.7311],STOP]}}}
  async function initMap(){
    if(!window.mapboxgl){loadingNote.textContent='แผนที่ออฟไลน์';return}
    try{
      mapboxgl.accessToken=TOKEN;
      const map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/light-v11',center:[(current[0]+STOP[0])/2,(current[1]+STOP[1])/2],zoom:state==='near'?17:14.4,bearing:18,pitch:0,attributionControl:true,interactive:true});
      map.dragRotate.disable();map.touchZoomRotate.disableRotation();
      new mapboxgl.Marker({element:driverEl(),anchor:'center'}).setLngLat(current).addTo(map);new mapboxgl.Marker({element:stopEl(),anchor:'center'}).setLngLat(STOP).addTo(map);
      map.on('load',async()=>{
        loadingNote.classList.add('hidden');let route=fallbackRoute();
        try{const path=`${current[0]},${current[1]};${STOP[0]},${STOP[1]}`;const r=await fetch(`https://api.mapbox.com/directions/v5/mapbox/driving-traffic/${path}?geometries=geojson&overview=full&steps=true&access_token=${encodeURIComponent(TOKEN)}`);const data=await r.json();if(data.routes&&data.routes[0])route={type:'Feature',geometry:data.routes[0].geometry}}catch(e){}
        map.addSource('route',{type:'geojson',data:route});map.addLayer({id:'route-shadow',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffffff','line-width':10,'line-opacity':.96}});map.addLayer({id:'route',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#172238','line-width':5.5}});
        const b=new mapboxgl.LngLatBounds();route.geometry.coordinates.forEach(c=>b.extend(c));b.extend(STOP);b.extend(current);map.fitBounds(b,{padding:{top:132,bottom:150,left:54,right:54},duration:0,maxZoom:state==='near'?17.3:15.4});
      });
      map.on('error',()=>{});
    }catch(e){useOfflineMap()}
  }
  function useOfflineMap(){frame.classList.remove('live-map');loadingNote.textContent='แผนที่ออฟไลน์';loadingNote.classList.remove('hidden')}
  function loadMapbox(){if(params.get('offline')==='1'){useOfflineMap();return}const css=document.createElement('link');css.rel='stylesheet';css.href='https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.css';document.head.appendChild(css);const script=document.createElement('script');script.src='https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.js';script.async=true;let done=false;const timer=setTimeout(()=>{if(!done)useOfflineMap()},4500);script.onload=()=>{done=true;clearTimeout(timer);frame.classList.add('live-map');initMap()};script.onerror=()=>{done=true;clearTimeout(timer);useOfflineMap()};document.head.appendChild(script)}
  loadMapbox();
</script>
