<script>
const params=new URLSearchParams(location.search);const context=params.get('context')==='network'?'network':'team';
const homeNav=document.getElementById('homeNav'),roleNav=document.getElementById('roleNav'),roleLabel=document.getElementById('roleLabel'),roleIcon=document.getElementById('roleIcon');
if(context==='network'){

const details={
 'team-15':{title:'UrbanFlowers',sub:'วันนี้ · 15:06',rows:[['จุดส่ง','3/3 จุด'],['ระยะทาง','11.2 กม.'],['ระยะเวลา','41 นาที'],['หลักฐาน','บันทึกแล้ว']]},
 'network-14':{title:'Khao Soi House',sub:'วันนี้ · 13:42',rows:[['จุดส่ง','1/1 จุด'],['ระยะทาง','4.8 กม.'],['ค่ารอบที่รับประกัน','฿185'],['หลักฐาน','บันทึกแล้ว']]},
