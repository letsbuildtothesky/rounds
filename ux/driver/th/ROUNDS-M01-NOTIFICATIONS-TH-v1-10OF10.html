<!DOCTYPE html>
<html lang="th">
<head>

<title>Rounds — M01 การแจ้งเตือน TH v1</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css');
:root{
  --canvas:#eef1f4;--paper:#fff;--ink:#172238;--ink2:#3d4a5d;--muted:#748094;
  --line:#e1e6ea;--line2:#cbd4dc;--orange:#ff6420;--green:#168b50;--red:#c94a47;
}
*{box-sizing:border-box}

button,a{font:inherit}button{cursor:pointer}

.statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:40}
.sb-right{display:flex;align-items:center;gap:6px}.signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}.battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}
.topbar{height:58px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:35}.brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}.read-all{height:38px;border:0;border-radius:6px;background:#fff;color:var(--ink2);font-size:12.5px;font-weight:820;padding:0 2px}.read-all:active{color:var(--orange)}.read-all:disabled{color:var(--muted);cursor:default}
.body{position:absolute;inset:86px 0 76px;background:#fff;overflow-y:auto;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.header{padding:24px 20px 20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11.5px;line-height:1;font-weight:880;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.header h1{margin:0;font-size:34px;line-height:1;letter-spacing:-.055em;font-weight:860}.unread-count{font-size:13px;line-height:1;font-weight:830;color:var(--orange);padding-bottom:3px;white-space:nowrap}.unread-count.all{color:var(--muted)}
.section{padding:22px 20px 0}.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}.section-title h2{margin:0;font-size:15px;line-height:1;font-weight:870;letter-spacing:-.02em}.section-title span{font-size:12px;font-weight:720;color:var(--muted)}
.notice{width:100%;min-height:92px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;color:inherit;padding:16px 0;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;position:relative}.notice:active{background:#fafbfb}.notice.unread:before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:3px;background:var(--orange)}.event-icon{width:28px;height:28px;color:var(--ink2);display:grid;place-items:center}.event-icon.orange{color:var(--orange)}.event-icon.green{color:var(--green)}.event-icon.red{color:var(--red)}.event-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.notice-copy{min-width:0}.notice-copy b{display:block;font-size:16px;line-height:1.17;font-weight:850;letter-spacing:-.025em}.notice-copy p{margin:7px 0 0;font-size:13.2px;line-height:1.38;font-weight:690;color:var(--muted)}.notice-copy .strong{color:var(--ink2);font-weight:790}.notice-time{font-size:11.5px;line-height:1;font-weight:720;color:var(--muted);padding-top:3px;white-space:nowrap}.notice.unread .notice-time{color:var(--orange)}
.network-only{display:none}
.empty{display:none;padding:38px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.45}.empty.show{display:block}
.bottomnav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px 9px;z-index:40}.nav-item{color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:720;border:0;background:#fff}.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:absolute;inset:0;background:rgba(10,18,31,.28);opacity:0;pointer-events:none;transition:.18s;z-index:70}.scrim.show{opacity:1;pointer-events:auto}.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;transform:translateY(105%);transition:.22s ease;z-index:80;padding:10px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:none;}.sheet.show{transform:none}.grab{width:38px;height:4px;border-radius:999px;background:#d7dde2;margin:0 auto 18px}.sheet-kicker{font-size:11.5px;line-height:1;font-weight:890;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}.sheet h3{margin:0;font-size:27px;line-height:1.04;letter-spacing:-.045em;font-weight:860}.sheet-sub{margin-top:8px;font-size:13.5px;line-height:1.4;font-weight:710;color:var(--muted)}.sheet-detail{margin-top:20px;border-top:1px solid var(--line)}.detail-row{min-height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.detail-row span{font-size:13px;font-weight:710;color:var(--muted)}.detail-row b{font-size:14px;font-weight:830;text-align:right}.sheet-actions{margin-top:18px;display:grid;gap:9px}.primary{height:56px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:16px;font-weight:850}.secondary{height:52px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink2);font-size:15px;font-weight:820}.toast{position:absolute;left:18px;right:18px;bottom:92px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:8px;font-size:13.5px;font-weight:760;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:90}.toast.show{opacity:1;transform:none}
@media(max-width:520px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(max-width:340px){.topbar{padding:0 16px}.header{padding:20px 16px 18px}.header h1{font-size:31px}.section{padding:18px 16px 0}.notice{min-height:84px;padding:13px 0;grid-template-columns:26px minmax(0,1fr) auto;gap:9px}.notice.unread:before{left:-16px}.event-icon{width:24px;height:24px}.event-icon svg{width:19px;height:19px}.notice-copy b{font-size:15px}.notice-copy p{margin-top:6px;font-size:12.5px}.notice-time{font-size:11px}.sheet{padding-left:16px;padding-right:16px}.sheet h3{font-size:25px}}
@media(max-height:720px){.header{padding-top:18px;padding-bottom:16px}.header h1{font-size:30px}.section{padding-top:16px}.notice{min-height:78px;padding:11px 0}.notice-copy p{margin-top:5px}}

/* Thai-first composition lock */
.statusbar,.brand{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.read-all{font-size:12.5px;line-height:1.35;font-weight:700}
.header{padding:21px 20px 19px}.eyebrow{font-size:12.5px;line-height:1.4;font-weight:650;letter-spacing:0;text-transform:none;margin-bottom:7px}.header h1{font-size:35px;line-height:1.16;letter-spacing:0;font-weight:800}.unread-count{font-size:12.5px;line-height:1.35;font-weight:700;padding-bottom:1px}
.section{padding:19px 20px 0}.section-title{padding-bottom:9px}.section-title h2{font-size:15px;line-height:1.4;font-weight:750;letter-spacing:0}.section-title span{font-size:12.5px;line-height:1.35;font-weight:600}
.notice{min-height:88px;padding:14px 0;grid-template-columns:28px minmax(0,1fr) auto;gap:11px}.notice-copy b{font-size:15.5px;line-height:1.35;font-weight:750;letter-spacing:0}.notice-copy p{margin-top:4px;font-size:12.8px;line-height:1.5;font-weight:600}.notice-copy .strong{font-weight:700}.notice-time{font-size:11.5px;line-height:1.35;font-weight:650;padding-top:2px}.nav-item{font-size:12px;line-height:1.3;font-weight:650}
.sheet{opacity:0;pointer-events:none;box-shadow:none}.sheet.show{opacity:1;pointer-events:auto}.sheet-kicker{font-size:12px;line-height:1.4;font-weight:700;letter-spacing:0;text-transform:none;margin-bottom:7px}.sheet h3{font-size:29px;line-height:1.18;letter-spacing:0;font-weight:800}.sheet-sub{font-size:13.5px;line-height:1.5;font-weight:600}.detail-row{min-height:56px}.detail-row span{font-size:13px;line-height:1.4;font-weight:600}.detail-row b{font-size:14px;line-height:1.4;font-weight:750}.sheet-actions .primary{background:var(--green);font-size:15.5px;line-height:1.35;font-weight:750}.sheet-actions .secondary{font-size:15px;line-height:1.35;font-weight:700}.toast{font-size:13px;line-height:1.45;font-weight:650}
@media(max-width:340px){.topbar{padding:0 16px}.header{padding:18px 16px 16px}.header h1{font-size:31px}.section{padding:16px 16px 0}.notice{min-height:82px;padding:12px 0;grid-template-columns:24px minmax(0,1fr) auto;gap:9px}.notice.unread:before{left:-16px}.event-icon{width:23px;height:23px}.event-icon svg{width:19px;height:19px}.notice-copy b{font-size:14.5px}.notice-copy p{font-size:12px;line-height:1.45}.notice-time{font-size:10.8px}.sheet{padding-left:16px;padding-right:16px}.sheet h3{font-size:26px}}

</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="statusbar">
    <div>16:41</div>
    <div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><div>5G</div><div class="battery"><b></b></div></div>
  </div>

  <div class="topbar">
    <div class="brand">Rounds<span class="brand-dot"></span></div>
    <button class="read-all" id="readAll">อ่านทั้งหมด</button>
  </div>

  <main class="body">
    <section class="header">
      <div class="eyebrow">กิจกรรม</div>
      <div class="title-row"><h1>การแจ้งเตือน</h1><div class="unread-count" id="unreadCount">ยังไม่อ่าน 3</div></div>
    </section>

    <section class="section" id="attentionSection">
      <div class="section-title"><h2>ต้องดู</h2><span>วันนี้</span></div>

      <button class="notice unread team-notice hybrid-notice" data-target="ROUNDS-E04-E05-E06-LIVE-ROUND-CHANGE-TH-v1-10OF10.html">
        <span class="event-icon orange"><svg viewBox="0 0 24 24"><path d="M4 7h10"/><path d="m11 4 3 3-3 3"/><path d="M20 17H10"/><path d="m13 14-3 3 3 3"/></svg></span>
        <span class="notice-copy"><b>อัปเดตรอบ</b><p><span class="strong">ทางเข้าใหม่ Gate B</span> · +2 นาที</p></span>
        <span class="notice-time">ตอนนี้</span>
      </button>

      <button class="notice unread team-notice hybrid-notice network-work-notice" data-target="ROUNDS-H01-OPERATOR-CHAT-TH-v1-10OF10.html">
        <span class="event-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg></span>
        <span class="notice-copy"><b>ข้อความจากฝ่ายจัดงาน</b><p>ฝากที่รีเซปชัน · ยังต้องถ่ายรูปยืนยัน</p></span>
        <span class="notice-time">3 นาที</span>
      </button>

      <button class="notice unread team-notice hybrid-notice" data-target="ROUNDS-B01B-TEAM-HOME-ROUND-ASSIGNED-TH-v2-10OF10.html">
        <span class="event-icon green"><svg viewBox="0 0 24 24"><path d="M4 7h10v10H4z"/><path d="M14 10h3l3 3v4h-6"/><circle cx="8" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></span>
        <span class="notice-copy"><b>ได้รับรอบแล้ว</b><p>UrbanFlowers · 3 จุด · รับของที่สุขุมวิท 39</p></span>
        <span class="notice-time">6 นาที</span>
      </button>

      <button class="notice unread network-only" data-target="ROUNDS-C01-SINGLE-DELIVERY-OFFER-TH-v1-10OF10.html">
        <span class="event-icon orange"><svg viewBox="0 0 24 24"><path d="M12 21s7-4.2 7-10a7 7 0 1 0-14 0c0 5.8 7 10 7 10Z"/><circle cx="12" cy="11" r="2.4"/></svg></span>
        <span class="notice-copy"><b>มีงานใหม่</b><p><span class="strong">ค่ารอบแน่นอน ฿240</span> · จุดรับห่าง 1.2 กม. · ทองหล่อ</p></span>
        <span class="notice-time">ตอนนี้</span>
      </button>

      <button class="notice unread network-only" id="availabilityRequest">
        <span class="event-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span>
        <span class="notice-copy"><b>ขอเช็กเวลาว่าง</b><p>UrbanFlowers ถามว่ารับงาน Network ช่วง 18:00–20:00 ได้ไหม</p></span>
        <span class="notice-time">4 นาที</span>
      </button>
    </section>

    <section class="section" id="recentSection">
      <div class="section-title"><h2>ล่าสุด</h2><span>สัปดาห์นี้</span></div>

      <button class="notice team-notice hybrid-notice network-work-notice" data-target="ROUNDS-H03-CONTACT-HISTORY-TH-v1-10OF10.html">
        <span class="event-icon green"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.2 17 19 7"/></svg></span>
        <span class="notice-copy"><b>ยืนยันรับของแล้ว</b><p>ยืนยัน 6 แพ็กอยู่กับคนขับ</p></span>
        <span class="notice-time">12:04</span>
      </button>

      <button class="notice team-notice hybrid-notice" data-target="ROUNDS-J01-MY-ROUNDS-TH-v1-10OF10.html">
        <span class="event-icon green"><svg viewBox="0 0 24 24"><path d="M4 8h16v10H4z"/><path d="M8 8V5h8v3"/></svg></span>
        <span class="notice-copy"><b>จบรอบแล้ว</b><p>UrbanFlowers · 4 จุด · บันทึกหลักฐานแล้ว</p></span>
        <span class="notice-time">10:24</span>
      </button>

      <button class="notice network-only" data-target="ROUNDS-K01-EARNINGS-TH-v1-10OF10.html">
        <span class="event-icon green"><svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M8 12h8"/></svg></span>
        <span class="notice-copy"><b>โอนเงินแล้ว</b><p>฿1,920 เข้า PromptPay · •••• 4821</p></span>
        <span class="notice-time">15:10</span>
      </button>
    </section>

    <div class="empty" id="empty">ไม่มีรายการค้าง</div>
  </main>

  <nav class="bottomnav" aria-label="เมนูหลัก">
    <a class="nav-item" id="homeNav" href="ROUNDS-B01-TEAM-DRIVER-HOME-TH-v2-10OF10.html"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>หน้าแรก</span></a>
    <a class="nav-item" href="ROUNDS-J01-MY-ROUNDS-TH-v1-10OF10.html"><svg viewBox="0 0 24 24"><path d="M12 20s7-3.6 7-9a7 7 0 1 0-14 0c0 5.4 7 9 7 9Z"/><circle cx="12" cy="11" r="2.5"/></svg><span>งาน</span></a>
    <a class="nav-item" id="roleNav" href="ROUNDS-K00-TEAM-HOURS-TH-v1-10OF10.html"><svg id="roleIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="roleLabel">ชั่วโมง</span></a>
    <a class="nav-item" href="ROUNDS-L01-DRIVER-PROFILE-TH-v1-10OF10.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>โปรไฟล์</span></a>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="sheet-kicker">ขอเช็กเวลาว่าง</div>
    <h3 id="sheetTitle">UrbanFlowers</h3>
    <div class="sheet-sub">รับงาน Network ช่วง 18:00–20:00 ได้ไหม?</div>
    <div class="sheet-detail">
      <div class="detail-row"><span>ช่วงเวลา</span><b>18:00–20:00</b></div>
      <div class="detail-row"><span>พื้นที่</span><b>สุขุมวิท / ทองหล่อ</b></div>
      <div class="detail-row"><span>การยืนยัน</span><b>เฉพาะเวลาว่าง</b></div>
    </div>

  </section>

  <div class="toast" id="toast"></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const context=['network','hybrid'].includes(params.get('context'))?params.get('context'):'team';
const homeNav=document.getElementById('homeNav'),roleNav=document.getElementById('roleNav'),roleLabel=document.getElementById('roleLabel'),roleIcon=document.getElementById('roleIcon');
function setNetworkNav(){homeNav.href='ROUNDS-B03-HOME-NETWORK-AVAILABLE-TH-v1-10OF10.html';roleNav.href='ROUNDS-K01-EARNINGS-TH-v1-10OF10.html';roleLabel.textContent='รายได้';roleIcon.innerHTML='<path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7H14.5a3.5 3.5 0 0 1 0 7H6"/>'}
if(context==='network')setNetworkNav();
document.querySelectorAll('.network-only').forEach(el=>el.style.display=context==='network'?'grid':'none');
document.querySelectorAll('.team-notice').forEach(el=>{if(context==='network')el.style.display='none'});
document.querySelectorAll('.hybrid-notice').forEach(el=>{if(context==='hybrid')el.style.display='grid'});
document.querySelectorAll('.network-work-notice').forEach(el=>{if(context==='network')el.style.display='grid'});

const unreadCount=document.getElementById('unreadCount'),readAll=document.getElementById('readAll'),toast=document.getElementById('toast');
function visibleUnread(){return [...document.querySelectorAll('.notice.unread')].filter(el=>getComputedStyle(el).display!=='none')}
function updateUnread(){const n=visibleUnread().length;unreadCount.textContent=n?`ยังไม่อ่าน ${n}`:'อ่านหมดแล้ว';unreadCount.classList.toggle('all',!n);readAll.textContent=n?'อ่านทั้งหมด':'อ่านหมดแล้ว';readAll.disabled=!n}
function showToast(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function markRead(row){row.classList.remove('unread');updateUnread()}
document.querySelectorAll('.notice[data-target]').forEach(row=>row.addEventListener('click',()=>{markRead(row);setTimeout(()=>{location.href=row.dataset.target+(context==='network'?'?context=network':'')},90)}));
readAll.addEventListener('click',()=>{visibleUnread().forEach(el=>el.classList.remove('unread'));updateUnread();showToast('อ่านทั้งหมดแล้ว')});

const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),availability=document.getElementById('availabilityRequest');
function openSheet(){if(availability)markRead(availability);scrim.classList.add('show');sheet.classList.add('show')}
function closeSheet(){scrim.classList.remove('show');sheet.classList.remove('show')}
availability?.addEventListener('click',openSheet);scrim.addEventListener('click',closeSheet);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.getElementById('availableBtn').addEventListener('click',()=>{closeSheet();showToast('ส่งเวลาว่างให้ UrbanFlowers แล้ว');setTimeout(()=>{location.href='ROUNDS-B03-HOME-NETWORK-AVAILABLE-TH-v1-10OF10.html'},450)});
document.getElementById('notNowBtn').addEventListener('click',()=>{closeSheet();showToast('แจ้งว่าไม่ว่างแล้ว')});
updateUnread();
</script>
</body>
</html>
