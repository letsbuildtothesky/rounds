<body>
<div class="stage">
  <div class="frame" id="frame">
    <div class="statusbar">
      <span>11:26</span>
      <div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"><b></b></div></div>
    </div>

    <main class="screen">
      <header class="topbar">
        <button class="back" id="backBtn" type="button" aria-label="ย้อนกลับ">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="top-copy"><small>จุด 1</small><b>K. Nattaporn</b></div>
        <div class="top-meta">1 จาก 4</div>
      </header>

      <section class="content">
        <div class="hero">
          <div class="hero-row">
            <h1>หลักฐานการส่ง</h1>
            <div class="progress"><strong id="progressValue">0 / 3</strong><span>ต้องทำ</span></div>
          </div>
          <div class="handoff" id="handoffLine"><b>ผู้รับ</b> · K. Nattaporn</div>
        </div>

        <section class="section">
          <div class="section-head"><b>แพ็กเกจ</b><span class="section-state" id="packageState">ต้องทำ</span></div>
          <div class="manifest">
            <button class="manifest-line" id="manifestLine" type="button">
              <span class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.2 17 19 7"/></svg></span>
              <span class="line-copy"><span class="line-title">Midnight Orchid + แจกันแก้ว</span><span class="line-meta">#8421 · ยืนยันตอนรับของแล้ว</span></span>
              <span class="line-side"><span class="qty">×1</span><span class="care">ระวัง</span></span>
            </button>
          </div>
          <button class="problem" id="packageProblem" type="button">มีปัญหากับแพ็กเกจ</button>
        </section>

        <section class="section" id="receiverSection" hidden>
          <div class="section-head"><b>ผู้รับของ</b><span class="section-state" id="receiverState">ต้องทำ</span></div>

            <span class="receiver-value" id="receiverValue">เลือก</span>
          </button>
        </section>

        <section class="section">
          <div class="section-head"><b>รูปยืนยันการส่ง</b><span class="section-state" id="photoState">ต้องทำ</span></div>

              <div class="camera">
                <svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/></svg>
              </div>

              <span>แตะเพื่อถ่าย</span>
            </div>
            <div class="photo-actions">
              <div class="photo-added">✓ เพิ่มรูปแล้ว</div>
              <button class="retake" id="retakeBtn" type="button">ถ่ายใหม่</button>

          </div>
        </section>

          <button class="sheet-action receiver-option" type="button" data-receiver="อื่นๆ"><span>อื่นๆ</span><span>›</span></button>
        </div>
        <button class="cancel" id="cancelSheet" type="button">ยกเลิก</button>
      </section>

      <div class="toast" id="toast"></div>
    </main>
  </div>
</div>

  let packageDone=false,photoDone=false,signatureDone=false,receiverDone=false,drawing=false;

  const leftLabel={reception:'รีเซปชัน',lobby:'ล็อบบี้ / ทางเข้า',door:'หน้าประตู',safe:'จุดที่อนุมัติ'}[left]||'จุดที่อนุมัติ';
  const handoffLine=document.getElementById('handoffLine');
  if(handoff==='recipient') handoffLine.innerHTML='<b>ผู้รับ</b> · K. Nattaporn';
  if(handoff==='other') handoffLine.innerHTML='<b>คนอื่นรับแทน</b> · ต้องระบุผู้รับ';
  if(handoff==='left') handoffLine.innerHTML='<b>วางไว้ที่จุดส่ง</b> · '+leftLabel;
  if(handoff==='left') document.getElementById('photoPrompt').textContent='ถ่ายรูปจุดที่วางของ';

  receiverSection.hidden=!requiresReceiver;
  signatureBlock.classList.toggle('show',requiresSignature);

  function totalRequired(){return 2+(requiresReceiver?1:0)+(requiresSignature?1:0)}
  function doneRequired(){return (packageDone?1:0)+(photoDone?1:0)+(requiresReceiver&&receiverDone?1:0)+(requiresSignature&&signatureDone?1:0)}
  function refresh(){
    const total=totalRequired(),done=doneRequired();
    progressValue.textContent=`${done} / ${total}`;
    const ready=done===total;
    completeBtn.disabled=!ready;
    completeBtn.classList.toggle('ready',ready);
  }
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}

  manifestLine.addEventListener('click',()=>{
    packageDone=!packageDone;
    manifestLine.classList.toggle('checked',packageDone);
    packageState.textContent=packageDone?'ยืนยันแล้ว':'ต้องทำ';packageState.classList.toggle('done',packageDone);
    refresh();
  });
  document.getElementById('packageProblem').addEventListener('click',()=>{location.href='ROUNDS-G03-PACKAGE-PROBLEM-TH-v3-10OF10.html'});

  function openReceiver(){receiverSheet.classList.add('show');receiverSheet.setAttribute('aria-hidden','false');scrim.classList.add('show')}
  function closeReceiver(){receiverSheet.classList.remove('show');receiverSheet.setAttribute('aria-hidden','true');scrim.classList.remove('show')}
  receiverRow.addEventListener('click',openReceiver);scrim.addEventListener('click',closeReceiver);document.getElementById('cancelSheet').addEventListener('click',closeReceiver);
  document.querySelectorAll('.receiver-option').forEach(btn=>btn.addEventListener('click',()=>{
    receiverDone=true;receiverValue.textContent=btn.dataset.receiver;receiverState.textContent='เพิ่มแล้ว';receiverState.classList.add('done');closeReceiver();refresh();
  }));

  function openCamera(){if(!photoDone)photoInput.click()}
  photoInput.addEventListener('click',e=>e.stopPropagation());
  photoSurface.addEventListener('click',e=>{if(e.target.closest('#retakeBtn'))return;openCamera()});
  photoSurface.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!photoDone){e.preventDefault();openCamera()}});
  photoInput.addEventListener('change',()=>{
    const file=photoInput.files&&photoInput.files[0];if(!file)return;
    photoImage.src=URL.createObjectURL(file);photoDone=true;photoSurface.classList.add('done');photoState.textContent='เพิ่มแล้ว';photoState.classList.add('done');refresh();
  });
  retakeBtn.addEventListener('click',e=>{
    e.stopPropagation();photoDone=false;photoSurface.classList.remove('done');photoState.textContent='ต้องทำ';photoState.classList.remove('done');photoInput.value='';refresh();setTimeout(()=>photoInput.click(),40);
  });

  function resizeCanvas(){
    if(!requiresSignature)return;
    const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#172238';
  }
  function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  canvas.addEventListener('pointerdown',e=>{if(!requiresSignature)return;drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();if(!signatureDone){signatureDone=true;signatureSurface.classList.add('has-signature');signatureState.textContent='เซ็นแล้ว';signatureState.classList.add('done');refresh()}});
  canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
  document.getElementById('clearSign').addEventListener('click',e=>{e.stopPropagation();ctx.clearRect(0,0,canvas.width,canvas.height);signatureDone=false;signatureSurface.classList.remove('has-signature');signatureState.textContent='ต้องทำ';signatureState.classList.remove('done');refresh()});

  completeBtn.addEventListener('click',()=>{
    if(completeBtn.disabled)return;
    completeBtn.textContent='ส่งจุด 1 สำเร็จ';showToast('บันทึกหลักฐานแล้ว');setTimeout(()=>{location.href='ROUNDS-F08-STOP-COMPLETE-NEXT-STOP-TH-v1-10OF10.html'},420);
  });
  document.getElementById('backBtn').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='ROUNDS-F01-F02-DROPOFF-HANDOFF-TH-v1-10OF10.html'});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReceiver()});
  window.addEventListener('resize',resizeCanvas);
  setTimeout(resizeCanvas,80);refresh();
</script>
</body>
</html>
