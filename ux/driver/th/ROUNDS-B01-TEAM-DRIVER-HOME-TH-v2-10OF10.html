<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rounds — B01 หน้าแรกคนขับทีม · Thai-first v2</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css');
  :root{
    --canvas:#eef1f4;
    --paper:#ffffff;
    --ink:#172238;
    --ink-2:#3d4a5d;
    --muted:#748094;
    --line:#e1e6ea;
    --line-2:#cbd4dc;
    --orange:#ff6420;
    --orange-soft:#fff3ec;
    --green:#168b50;
    --green-soft:#edf8f2;
    --blue:#3269b7;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;min-height:100%;background:var(--canvas);color:var(--ink);
    font-family:'LINE Seed Sans TH',Tahoma,'Noto Sans Thai',sans-serif;
  }
  button,a{font:inherit}
  body{padding:28px}

  .frame{
    width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;
    border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14);
  }

  .statusbar{
    height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;
    font-size:12px;font-weight:700;background:#fff;position:relative;z-index:30;
  }
  .sb-right{display:flex;align-items:center;gap:6px}
  .signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}
  .signal i{display:block;width:2px;background:currentColor;border-radius:1px}
  .signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}
  .battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}
  .battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
  .battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}

  .topbar{
    height:56px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;background:#fff;position:relative;z-index:30;
  }
  .brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}
  .brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}
  .icon-btn{
    width:40px;height:40px;border:1px solid transparent;background:#fff;color:var(--ink-2);display:grid;
    place-items:center;border-radius:7px;cursor:pointer;text-decoration:none;
  }
  .icon-btn:hover{border-color:var(--line)}
  .icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .body{position:absolute;inset:84px 0 76px;background:#fff;overflow:hidden;display:flex;flex-direction:column}

  .hero{
    padding:21px 20px 22px;border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto;
  }
  .state-line{
    display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--green);margin-bottom:9px;
  }
  .state-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .hero h1{
    margin:0;max-width:325px;font-size:31px;line-height:1.01;letter-spacing:-.055em;font-weight:790;
  }

  .shift-section{padding:24px 20px 26px;flex:0 0 auto}
  .section-title{font-size:11.5px;line-height:1;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .time-left{font-size:34px;line-height:1;letter-spacing:-.045em;font-weight:820;color:var(--ink);margin-bottom:23px}
  .track{height:5px;border-radius:999px;background:#e8edf0;position:relative;overflow:visible;margin:0 0 13px}
  .progress{height:100%;width:19%;background:var(--orange);border-radius:999px;position:relative}
  .progress:after{
    content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--orange);
    transform:translateY(-50%);box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(255,100,32,.22);
  }
  .shift-times{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:760;color:var(--muted)}
  .shift-times strong{font-weight:820;color:var(--ink-2)}

  .breathing-space{flex:1 1 auto;min-height:36px;background:#fff}

  .dispatch{padding:0 20px;border-top:1px solid var(--line);flex:0 0 auto;background:#fff}
  .dispatch-row{
    min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .dispatch-copy{min-width:0}
  .dispatch-label{font-size:11.5px;line-height:1;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .dispatch-name{font-size:16px;line-height:1.12;font-weight:820;letter-spacing:-.02em}
  .dispatch-actions{display:flex;gap:7px;flex:0 0 auto}
  .utility{
    width:44px;height:44px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink-2);
    display:grid;place-items:center;text-decoration:none;cursor:pointer;
  }
  .utility:hover{border-color:var(--line-2);background:#fafbfc}
  .utility svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .bottomnav{
    position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px 9px;z-index:40;
  }
  .nav-item{
    color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;font-size:11.5px;font-weight:720;border:0;background:#fff;cursor:pointer;
  }
  .nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav-item.active{color:var(--orange)}

  /* Thai-first composition */
  .statusbar,.brand{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .hero{padding:25px 20px 25px}
  .state-line{font-size:13.5px;line-height:1.45;font-weight:730;letter-spacing:0;margin-bottom:9px}
  .hero h1{max-width:none;font-size:40px;line-height:1.12;letter-spacing:0;font-weight:800}
  .shift-section{padding:25px 20px 27px}
  .section-title{font-size:12.5px;line-height:1.45;font-weight:700;letter-spacing:0;text-transform:none;margin-bottom:11px}
  .time-left{display:block;margin-bottom:22px;letter-spacing:0}
  .time-left span{display:block;margin-bottom:6px;font-size:13.5px;line-height:1.4;color:var(--muted);font-weight:620}
  .time-left strong{display:block;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:34px;line-height:1;font-weight:820;letter-spacing:-.035em;white-space:nowrap}
  .shift-times{font-size:13px;line-height:1.4;font-weight:590}.shift-times strong{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-weight:790}
  .dispatch-label{font-size:12px;line-height:1.4;font-weight:700;letter-spacing:0;text-transform:none;margin-bottom:4px}
  .dispatch-name{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15.5px;letter-spacing:-.01em}
  .nav-item{font-size:10.8px;line-height:1.3;font-weight:620;white-space:nowrap}
  @media(max-width:340px){
    .hero{padding:22px 16px 23px}.state-line{font-size:12.7px}.hero h1{font-size:36px;line-height:1.14}
    .shift-section{padding:22px 16px 24px}.time-left strong{font-size:31px}.time-left span{font-size:12.7px}
    .dispatch{padding-left:16px;padding-right:16px}.dispatch-row{min-height:88px}.nav-item{font-size:10.1px}
  }
  @media(max-width:460px){
    body{padding:0;background:#fff}
    .frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}
  }
</style>
</head>
