<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rounds — C01 Single Delivery Offer v4</title>
<style>
  :root{
    --canvas:#eef1f4;
    --paper:#ffffff;
    --ink:#172238;
    --ink-2:#3d4a5d;
    --muted:#748094;
    --line:#e1e6ea;
    --line-2:#cbd4dc;
    --orange:#ff6420;
    --orange-soft:#fff3ec;
    --green:#168b50;
    --map:#f3f6f7;
    --road:#ffffff;
    --road-edge:#e1e6e9;
    --blue:#2f6fbd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,a{font:inherit}
  body{padding:28px}
  .frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}

  .statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:30}
  .sb-right{display:flex;align-items:center;gap:6px}
  .signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}
  .battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}

  .topbar{height:56px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fff;position:relative;z-index:30}
  .brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}

  .body{position:absolute;inset:84px 0 132px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
  .hero{padding:19px 20px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .eyebrow{font-size:11.5px;line-height:1;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .fare-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
  .fare{font-size:52px;line-height:.9;letter-spacing:-.065em;font-weight:900}
  .fare-label{font-size:13px;color:var(--green);font-weight:820;padding-bottom:4px;white-space:nowrap}

  .pickup-strip{min-height:64px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
  .pickup-copy{min-width:0}.pickup-label{font-size:11.5px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.pickup-place{font-size:14.5px;font-weight:790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pickup-distance{text-align:right;flex:0 0 auto}.pickup-distance strong{display:block;font-size:19px;line-height:1;font-weight:850;letter-spacing:-.035em}.pickup-distance span{display:block;margin-top:5px;font-size:11.5px;color:var(--muted);font-weight:690}

  .map-wrap{position:relative;flex:1 1 auto;min-height:260px;background:var(--map);overflow:hidden;border-bottom:1px solid var(--line)}
  .map{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0)),var(--map)}
  .block{position:absolute;background:#e8edef;border-radius:5px;opacity:.72}.park{position:absolute;background:#e4f0e7;border-radius:5px}.water{position:absolute;background:#e2f1f4;border-radius:48%}
  .road{position:absolute;background:var(--road);box-shadow:0 0 0 1px var(--road-edge);border-radius:999px;transform-origin:center}.road.major{height:12px}.road.minor{height:7px}
  .route-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.route-shadow{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.92}.route-main{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .current{position:absolute;left:44px;bottom:52px;width:18px;height:18px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 1px rgba(47,111,189,.25),0 2px 8px rgba(23,34,56,.16)}
  .pin{position:absolute;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 0 0 1px rgba(23,34,56,.08),0 4px 10px rgba(23,34,56,.13)}
  .pin svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .pickup-pin{left:125px;top:79px;background:var(--ink);color:#fff}.end-pin{right:58px;top:39px;background:var(--orange);color:#fff}
  .map-label{position:absolute;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:7px;padding:8px 10px;line-height:1.05;box-shadow:0 4px 12px rgba(23,34,56,.05)}
  .map-label b{display:block;font-size:12.5px;font-weight:820}.map-label span{display:block;margin-top:4px;font-size:10.5px;color:var(--muted);font-weight:690}
  .pickup-map-label{left:86px;top:112px}.end-map-label{right:18px;top:74px;text-align:right}
  .you-label{position:absolute;left:27px;bottom:27px;font-size:10.5px;color:var(--muted);font-weight:720}

  .decision-context{padding:13px 20px 14px;flex:0 0 auto;background:#fff}
  .trip-line{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:24px;font-size:13.5px;font-weight:760;color:var(--ink-2)}
  .trip-line strong{font-size:14px;color:var(--ink);font-weight:830;white-space:nowrap}
  .handling{margin-top:8px;font-size:12.5px;line-height:1.2;color:var(--muted);font-weight:700}.handling b{color:var(--orange);font-weight:820}

  .footer{position:absolute;left:0;right:0;bottom:0;height:132px;padding:11px 20px 14px;background:#fff;border-top:1px solid var(--line);z-index:40}
  .accept{width:100%;height:62px;border:0;border-radius:7px;background:var(--green);color:#fff;font-size:17px;font-weight:830;letter-spacing:-.01em;cursor:pointer}
  .decline{width:100%;height:42px;margin-top:3px;border:0;background:#fff;color:var(--muted);font-size:14px;font-weight:780;cursor:pointer}
  .accept:hover{background:#127c46}.decline:hover{color:var(--ink)}

  @media(max-width:350px){
    .hero{padding-top:17px;padding-bottom:16px}.fare{font-size:47px}.map-wrap{min-height:240px}
    .pickup-strip{padding-left:18px;padding-right:18px}.decision-context{padding-left:18px;padding-right:18px}.footer{padding-left:18px;padding-right:18px}
    .decision-context{padding-top:7px;padding-bottom:7px}
    .trip-line{min-height:18px;font-size:12.5px}.trip-line strong{font-size:13px}
    .handling{margin-top:3px;font-size:11.5px}
  }
  @media(max-width:460px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="statusbar">
    <span>17:21</span>
    <div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"><b></b></div></div>
  </div>

  <div class="topbar">
    <div class="brand">Rounds<span class="brand-dot"></span></div>
  </div>

  <main class="body">
    <section class="hero">
      <div class="eyebrow">Guaranteed fare</div>
      <div class="fare-row">
        <div class="fare">฿185</div>
        <div class="fare-label">1 delivery</div>
      </div>
    </section>

    <section class="pickup-strip" aria-label="Pickup distance">
      <div class="pickup-copy">
        <div class="pickup-label">Pickup</div>
        <div class="pickup-place">UrbanFlowers</div>
      </div>
      <div class="pickup-distance"><strong>1.4 km</strong><span>~5 min away</span></div>
    </section>

    <section class="map-wrap" aria-label="Offer route preview">
      <div class="map" aria-hidden="true">
        <div class="block" style="left:22px;top:17px;width:67px;height:38px"></div>
        <div class="block" style="left:109px;top:18px;width:80px;height:46px"></div>
        <div class="block" style="right:20px;top:15px;width:76px;height:45px"></div>
        <div class="block" style="left:27px;bottom:27px;width:80px;height:48px"></div>
        <div class="block" style="left:130px;bottom:19px;width:70px;height:54px"></div>
        <div class="park" style="right:18px;bottom:20px;width:74px;height:52px"></div>
        <div class="water" style="left:-35px;bottom:80px;width:120px;height:42px;transform:rotate(-8deg)"></div>

        <div class="road major" style="left:-26px;top:143px;width:450px;transform:rotate(-8deg)"></div>
        <div class="road major" style="left:170px;top:-38px;width:350px;transform:rotate(78deg)"></div>
        <div class="road minor" style="left:17px;top:65px;width:230px;transform:rotate(12deg)"></div>
        <div class="road minor" style="left:38px;bottom:57px;width:306px;transform:rotate(-4deg)"></div>
        <div class="road minor" style="left:282px;top:1px;width:260px;transform:rotate(88deg)"></div>

        <svg class="route-svg" viewBox="0 0 393 300" preserveAspectRatio="none">
          <path class="route-shadow" d="M54 228 C82 202 104 165 138 111 C174 61 221 90 262 74 C294 61 314 52 330 45"/>
          <path class="route-main" d="M54 228 C82 202 104 165 138 111 C174 61 221 90 262 74 C294 61 314 52 330 45"/>
        </svg>
        <div class="current"></div>
        <div class="you-label">You</div>
        <div class="pin pickup-pin"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></div>
        <div class="map-label pickup-map-label"><b>Pickup</b><span>Sukhumvit 39</span></div>
        <div class="pin end-pin"><svg viewBox="0 0 24 24"><path d="M12 21s6-4.4 6-10a6 6 0 1 0-12 0c0 5.6 6 10 6 10Z"/><circle cx="12" cy="11" r="2"/></svg></div>
        <div class="map-label end-map-label"><b>Ends in Thonglor</b><span>Destination area</span></div>
      </div>
    </section>

    <section class="decision-context" aria-label="Offer details">
      <div class="trip-line"><span>Estimated trip</span><strong>4.8 km · ~17 min</strong></div>
      <div class="handling"><b>Fragile bouquet</b></div>
    </section>
  </main>

  <footer class="footer">
    <button class="accept" type="button" onclick="location.href='ROUNDS-D01-NAVIGATE-TO-PICKUP-v5-10OF10.html'">Accept · ฿185</button>
    <button class="decline" type="button" onclick="location.href='ROUNDS-B03-HOME-NETWORK-AVAILABLE-v8-10OF10.html'">Decline</button>
  </footer>
</div>
</body>
</html>
