<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rounds — I01 Round Complete v3</title>
<style>
:root{
  --canvas:#eef1f4;--paper:#fff;--ink:#172238;--ink2:#3d4a5d;--muted:#748094;
  --line:#e1e6ea;--line2:#cbd4dc;--orange:#ff6420;--green:#168b50;--green-soft:#eef8f2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
body{padding:28px}
.frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}
.statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:30}
.sb-right{display:flex;align-items:center;gap:6px}.signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}.battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}
.topbar{height:56px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:#fff}.brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}
.screen{position:absolute;inset:84px 0 0;background:#fff;display:flex;flex-direction:column}
.hero{padding:34px 20px 31px;border-bottom:1px solid var(--line)}
.state{display:flex;align-items:center;gap:9px;color:var(--green);font-size:12px;line-height:1;font-weight:880;letter-spacing:.09em;text-transform:uppercase;margin-bottom:18px}.check{width:22px;height:22px;display:grid;place-items:center}.check svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hero h1{margin:0;font-size:42px;line-height:.98;letter-spacing:-.06em;font-weight:840;max-width:330px}.hero-sub{margin-top:14px;font-size:18px;line-height:1.25;font-weight:790;color:var(--ink2);letter-spacing:-.025em}.hero-meta{margin-top:8px;font-size:14px;font-weight:720;color:var(--muted)}
.summary{padding:0 20px}.summary-row{min-height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.summary-row span{font-size:14px;font-weight:760;color:var(--muted)}.summary-row b{font-size:17px;font-weight:850;letter-spacing:-.025em;text-align:right}.summary-row .good{color:var(--green)}
.shift{padding:28px 20px 26px}.section-title{font-size:11.5px;line-height:1;font-weight:880;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.shift-state{font-size:15px;font-weight:820;color:var(--green);margin-bottom:8px}.shift-time{font-size:34px;line-height:1;letter-spacing:-.045em;font-weight:830;margin-bottom:23px}.track{height:5px;border-radius:999px;background:#e8edf0;position:relative;margin-bottom:13px}.progress{height:100%;width:79%;background:var(--orange);border-radius:999px;position:relative}.progress:after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--orange);transform:translateY(-50%);box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(255,100,32,.22)}.shift-times{display:flex;justify-content:space-between;font-size:13px;font-weight:760;color:var(--muted)}.shift-times strong{font-weight:840;color:var(--ink2)}
.network-earnings{display:none;padding:28px 20px 0}.network-earnings.show{display:block}.fare-label{font-size:11.5px;line-height:1;font-weight:880;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.fare{font-size:42px;line-height:1;font-weight:870;letter-spacing:-.055em}.fare-note{margin-top:8px;color:var(--green);font-size:14px;font-weight:780}
.space{flex:1 1 auto;min-height:20px}
.footer{padding:12px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;flex:0 0 auto}.primary{width:100%;height:62px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:17px;font-weight:860;cursor:pointer}.primary:active{transform:translateY(1px)}
.toast{position:absolute;left:18px;right:18px;bottom:94px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:8px;font-size:13.5px;font-weight:760;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:60}.toast.show{opacity:1;transform:none}
@media(max-width:520px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(max-width:340px){.hero{padding:27px 16px 25px}.hero h1{font-size:36px}.hero-sub{font-size:16px}.hero-meta{font-size:13px}.summary{padding:0 16px}.summary-row{min-height:62px}.shift{padding:23px 16px}.shift-time{font-size:30px;margin-bottom:20px}.network-earnings{padding:23px 16px 0}.fare{font-size:38px}.footer{padding-left:16px;padding-right:16px}.primary{height:58px;font-size:16px}}
@media(max-height:720px){.hero{padding-top:24px;padding-bottom:22px}.hero h1{font-size:36px}.hero-sub{margin-top:10px;font-size:16px}.hero-meta{margin-top:6px}.summary-row{min-height:58px}.shift{padding-top:20px;padding-bottom:18px}.shift-time{font-size:29px;margin-bottom:18px}.network-earnings{padding-top:20px}.fare{font-size:36px}.footer{padding-top:10px;padding-bottom:12px}.primary{height:56px}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="statusbar">
    <div>15:08</div>
    <div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><div>5G</div><div class="battery"><b></b></div></div>
  </div>
  <div class="topbar"><div class="brand">Rounds<span class="brand-dot"></span></div></div>

  <main class="screen">
    <section class="hero">
      <div class="state"><span class="check"><svg viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17 19.5 6.5"/></svg></span><span>Round complete</span></div>
      <h1>4 of 4 delivered</h1>
      <div class="hero-sub" id="heroSub">All on time</div>
      <div class="hero-meta">UrbanFlowers · Round 18</div>
    </section>

    <section class="shift" id="teamShift" aria-label="Shift continuation">
      <div class="section-title">Shift</div>
      <div class="shift-state">Shift continues</div>
      <div class="shift-time">1h 52m left</div>
      <div class="track" aria-label="79 percent of shift complete"><div class="progress"></div></div>
      <div class="shift-times"><span><strong>08:00</strong> start</span><span>ends <strong>17:00</strong></span></div>
    </section>

    <section class="network-earnings" id="networkSummary" aria-label="Network Round earnings">
      <div class="fare-label">Guaranteed fare</div>
      <div class="fare">฿420</div>
      <div class="fare-note">Round completed</div>
    </section>

    <div class="space" aria-hidden="true"></div>

    <div class="footer">
      <button class="primary" id="homeBtn">Continue shift</button>
    </div>
  </main>
  <div class="toast" id="toast"></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const context=params.get('context')==='network'?'network':'team';
const teamShift=document.getElementById('teamShift'),networkSummary=document.getElementById('networkSummary'),homeBtn=document.getElementById('homeBtn'),heroSub=document.getElementById('heroSub'),toast=document.getElementById('toast');
if(context==='network'){
  teamShift.style.display='none';networkSummary.classList.add('show');
  heroSub.style.display='none';homeBtn.textContent='Open for jobs';
}else{
  networkSummary.classList.remove('show');
}
homeBtn.addEventListener('click',()=>{
  const target=context==='network'?'ROUNDS-B03-HOME-NETWORK-AVAILABLE-v8-10OF10.html':'ROUNDS-B01-TEAM-DRIVER-HOME-v4-10OF10.html';
  toast.textContent=context==='network'?'Opening Network Home':'Returning to Home';toast.classList.add('show');
  setTimeout(()=>{location.href=target},320);
});
</script>
</body>
</html>
