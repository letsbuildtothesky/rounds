<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rounds — B01F End Shift Confirmation v2</title>
<style>
  :root{
    --canvas:#eef1f4;
    --paper:#ffffff;
    --ink:#172238;
    --ink-2:#3d4a5d;
    --muted:#748094;
    --line:#e1e6ea;
    --line-2:#cbd4dc;
    --orange:#ff6420;
    --green:#168b50;
    --green-soft:#edf8f2;
    --amber:#b87916;
    --amber-soft:#fff8e8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,a{font:inherit}
  body{padding:28px}
  .frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}

  .statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:20}
  .sb-right{display:flex;align-items:center;gap:6px}
  .signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}
  .battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}

  .topbar{height:58px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20}
  .brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}
  .icon-btn{width:38px;height:38px;border:0;background:#fff;color:var(--ink-2);display:grid;place-items:center;text-decoration:none;border-radius:7px}.icon-btn:hover{background:#f8f9fa}.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .body{position:absolute;inset:86px 0 76px;display:flex;flex-direction:column;background:#fff}

  .hero{padding:31px 20px 28px;border-bottom:1px solid var(--line)}
  .state-line{display:flex;align-items:center;gap:9px;color:var(--green);font-size:14px;font-weight:790}
  .state-mark{width:18px;height:18px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center}.state-mark svg{width:11px;height:11px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:18px 0 0;font-size:40px;line-height:.99;letter-spacing:-.058em;font-weight:890;max-width:330px}
  .shift-line{margin-top:12px;font-size:17px;line-height:1.2;color:var(--ink-2);font-weight:720}

  .hours{padding:27px 20px 25px;border-bottom:1px solid var(--line)}
  .section-label{font-size:11.5px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
  .total-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
  .total{font-size:43px;line-height:.96;font-weight:890;letter-spacing:-.055em}
  .total-caption{font-size:13px;color:var(--muted);font-weight:720;padding-bottom:4px}
  .breakdown{margin-top:23px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:13px}
  .break-row{display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:14px;font-weight:730;color:var(--ink-2)}
  .break-row strong{font-size:15px;color:var(--ink);font-weight:820}
  .break-row.overtime span,.break-row.overtime strong{color:var(--amber)}


  .spacer{flex:1 1 auto;min-height:20px}

  .actions{padding:16px 20px 16px;border-top:1px solid var(--line);background:#fff;flex:0 0 auto}
  .primary{min-height:62px;width:100%;border:0;border-radius:7px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:830;cursor:pointer}.primary:hover{background:#127743}.primary svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .secondary{margin-top:9px;min-height:46px;width:100%;border:0;background:#fff;color:var(--ink-2);font-size:14px;font-weight:780;cursor:pointer;border-radius:7px}.secondary:hover{background:#f8f9fa}

  .bottomnav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px 9px;z-index:40}
  .nav-item{color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:720;border:0;background:#fff;cursor:pointer}.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav-item.active{color:var(--orange)}

  @media(max-width:460px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="statusbar">
    <span>17:22</span>
    <div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"><b></b></div></div>
  </div>

  <div class="topbar">
    <div class="brand">Rounds<span class="brand-dot"></span></div>
    <a class="icon-btn" href="ROUNDS-M01-NOTIFICATIONS-v2-10OF10.html" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </a>
  </div>

  <main class="body">
    <section class="hero">
      <div class="state-line">
        <span class="state-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></svg></span>
        <span>Last delivery complete</span>
      </div>
      <h1>Ready to end shift?</h1>
      <div class="shift-line">UrbanFlowers</div>
    </section>

    <section class="hours" aria-label="Today's hours">
      <div class="section-label">Today</div>
      <div class="total-row">
        <div class="total">8h 22m</div>
        <div class="total-caption">On the clock</div>
      </div>
      <div class="breakdown">
        <div class="break-row"><span>Regular</span><strong>8h 00m</strong></div>
        <div class="break-row overtime"><span>Overtime</span><strong>22m</strong></div>
      </div>
    </section>


    <div class="spacer"></div>

    <section class="actions">
      <button class="primary" id="endShift" type="button">
        <span>End shift</span>
        <svg viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></svg>
      </button>
      <button class="secondary" id="notYet" type="button">Not yet</button>
    </section>
  </main>

  <nav class="bottomnav" aria-label="Primary">
    <a class="nav-item active" href="#" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Home</span>
    </a>
    <a class="nav-item" href="ROUNDS-J01-MY-ROUNDS-v7-10OF10.html">
      <svg viewBox="0 0 24 24"><path d="M12 20s7-3.6 7-9a7 7 0 1 0-14 0c0 5.4 7 9 7 9Z"/><circle cx="12" cy="11" r="2.5"/></svg><span>Jobs</span>
    </a>
    <a class="nav-item" href="ROUNDS-K00-TEAM-HOURS-v5-10OF10.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Hours</span>
    </a>
    <a class="nav-item" href="ROUNDS-L01-DRIVER-PROFILE-v3-10OF10.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span>
    </a>
  </nav>
</div>

<script>
  document.getElementById('endShift').addEventListener('click', () => {
    window.location.href = 'ROUNDS-B01C-SHIFT-ENDED-SWITCH-TO-NETWORK-v2-10OF10.html';
  });
  document.getElementById('notYet').addEventListener('click', () => {
    window.location.href = 'ROUNDS-B01E-SHIFT-OVERTIME-v3-10OF10.html';
  });
</script>
</body>
</html>
