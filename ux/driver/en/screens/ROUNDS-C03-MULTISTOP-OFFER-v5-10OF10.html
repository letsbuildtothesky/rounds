<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rounds — C03 Multistop Offer v5</title>
<style>
  :root{
    --canvas:#eef1f4;
    --paper:#ffffff;
    --ink:#172238;
    --ink-2:#3d4a5d;
    --muted:#748094;
    --line:#e1e6ea;
    --line-2:#cbd4dc;
    --orange:#ff6420;
    --orange-soft:#fff3ec;
    --green:#168b50;
    --map:#f3f6f7;
    --road:#ffffff;
    --road-edge:#e1e6e9;
    --blue:#2f6fbd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,a{font:inherit}
  body{padding:28px}
  .frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}

  .statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:30}
  .sb-right{display:flex;align-items:center;gap:6px}
  .signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}
  .battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}

  .topbar{height:56px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fff;position:relative;z-index:30}
  .brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}

  .body{position:absolute;inset:84px 0 132px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
  .hero{padding:19px 20px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .eyebrow{font-size:11.5px;line-height:1;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .fare-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
  .fare{font-size:52px;line-height:.9;letter-spacing:-.065em;font-weight:900}
  .fare-label{font-size:13px;color:var(--green);font-weight:820;padding-bottom:4px;white-space:nowrap}

  .pickup-strip{min-height:64px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
  .pickup-copy{min-width:0}.pickup-label{font-size:11.5px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.pickup-place{font-size:14.5px;font-weight:790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pickup-distance{text-align:right;flex:0 0 auto}.pickup-distance strong{display:block;font-size:19px;line-height:1;font-weight:850;letter-spacing:-.035em}.pickup-distance span{display:block;margin-top:5px;font-size:11.5px;color:var(--muted);font-weight:690}

  .map-wrap{position:relative;flex:1 1 auto;min-height:248px;background:var(--map);overflow:hidden;border-bottom:1px solid var(--line)}
  .map{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0)),var(--map)}
  .block{position:absolute;background:#e8edef;border-radius:5px;opacity:.72}.park{position:absolute;background:#e4f0e7;border-radius:5px}.water{position:absolute;background:#e2f1f4;border-radius:48%}
  .road{position:absolute;background:var(--road);box-shadow:0 0 0 1px var(--road-edge);border-radius:999px;transform-origin:center}.road.major{height:12px}.road.minor{height:7px}
  .route-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.route-shadow{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.94}.route-main{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.to-pickup{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-dasharray:5 6;stroke-linecap:round;opacity:.9}
  .current{position:absolute;left:38px;bottom:42px;width:18px;height:18px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 1px rgba(47,111,189,.25),0 2px 8px rgba(23,34,56,.16)}
  .pickup-pin{position:absolute;left:100px;bottom:105px;width:29px;height:29px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 1px rgba(23,34,56,.08),0 4px 10px rgba(23,34,56,.13);font-size:11px;font-weight:900}
  .stop-pin{position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink);box-shadow:0 3px 8px rgba(23,34,56,.08)}
  .s1{left:169px;top:70px}.s2{left:226px;top:113px}.s3{right:74px;top:58px}.s4{right:31px;top:130px;border-color:var(--orange);color:var(--orange)}
  .map-label{position:absolute;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:7px;padding:7px 9px;line-height:1.05;box-shadow:0 4px 12px rgba(23,34,56,.05)}
  .map-label b{display:block;font-size:12px;font-weight:830}.map-label span{display:block;margin-top:4px;font-size:10.5px;color:var(--muted);font-weight:690}
  .pickup-map-label{left:70px;bottom:73px}.end-map-label{right:15px;top:166px;text-align:right}
  .you-label{position:absolute;left:23px;bottom:18px;font-size:10.5px;color:var(--muted);font-weight:720}

  .decision-context{padding:10px 20px 10px;flex:0 0 auto;background:#fff}
  .trip-line{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:22px;font-size:13px;font-weight:760;color:var(--ink-2)}
  .trip-line + .trip-line{margin-top:2px}.trip-line strong{font-size:13.5px;color:var(--ink);font-weight:830;white-space:nowrap}
  .handling-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:5px;min-height:28px}
  .handling{font-size:12px;line-height:1.2;color:var(--orange);font-weight:820}
  .areas-btn{border:0;background:#fff;color:var(--ink-2);font-size:12px;font-weight:800;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}.areas-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

  .footer{position:absolute;left:0;right:0;bottom:0;height:132px;padding:11px 20px 14px;background:#fff;border-top:1px solid var(--line);z-index:40}
  .accept{width:100%;height:62px;border:0;border-radius:7px;background:var(--green);color:#fff;font-size:17px;font-weight:830;letter-spacing:-.01em;cursor:pointer}
  .decline{width:100%;height:42px;margin-top:3px;border:0;background:#fff;color:var(--muted);font-size:14px;font-weight:780;cursor:pointer}
  .accept:hover{background:#127c46}.decline:hover{color:var(--ink)}

  .sheet-backdrop{position:absolute;inset:84px 0 0;background:rgba(23,34,56,.18);z-index:60;display:none}
  .sheet-backdrop.show{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:18px 20px 22px;box-shadow:0 -14px 35px rgba(23,34,56,.12)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}.sheet-title{font-size:19px;font-weight:880;letter-spacing:-.03em}.sheet-close{width:36px;height:36px;border:0;background:#f4f6f7;border-radius:7px;color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
  .area-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;min-height:48px;border-top:1px solid var(--line)}.area-row:first-of-type{border-top:0}
  .area-num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:11px;font-weight:850}.area-row:last-child .area-num{border-color:var(--orange);color:var(--orange)}
  .area-name{font-size:14px;font-weight:800}.area-time{font-size:12px;color:var(--muted);font-weight:720;white-space:nowrap}
  .sheet-note{font-size:11.5px;color:var(--muted);font-weight:690;margin-top:8px}

  @media(max-width:350px){
    .hero{padding-top:17px;padding-bottom:16px}.fare{font-size:47px}.map-wrap{min-height:235px}
    .pickup-strip{padding-left:18px;padding-right:18px}.decision-context{padding-left:18px;padding-right:18px}.footer{padding-left:18px;padding-right:18px}
    .decision-context{padding-top:7px;padding-bottom:7px}.trip-line{font-size:12.2px}.trip-line strong{font-size:12.7px}.handling{font-size:11.3px}.areas-btn{font-size:11.3px}
    .s1{left:143px;top:69px}.s2{left:191px;top:113px}.s3{right:59px;top:57px}.s4{right:24px;top:129px}
    .pickup-pin{left:85px;bottom:99px}.pickup-map-label{left:58px;bottom:67px}.end-map-label{right:10px;top:164px}
  }
  @media(max-width:460px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="statusbar">
    <span>10:42</span>
    <div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"><b></b></div></div>
  </div>

  <div class="topbar">
    <div class="brand">Rounds<span class="brand-dot"></span></div>
  </div>

  <main class="body">
    <section class="hero">
      <div class="eyebrow">Guaranteed fare</div>
      <div class="fare-row">
        <div class="fare">฿420</div>
        <div class="fare-label">4-stop Round</div>
      </div>
    </section>

    <section class="pickup-strip" aria-label="Pickup distance">
      <div class="pickup-copy">
        <div class="pickup-label">Pickup</div>
        <div class="pickup-place">UrbanFlowers</div>
      </div>
      <div class="pickup-distance"><strong>1.2 km</strong><span>~4 min away</span></div>
    </section>

    <section class="map-wrap" aria-label="Round route preview">
      <div class="map" aria-hidden="true">
        <div class="block" style="left:20px;top:16px;width:70px;height:40px"></div>
        <div class="block" style="left:112px;top:18px;width:72px;height:45px"></div>
        <div class="block" style="right:22px;top:16px;width:72px;height:43px"></div>
        <div class="block" style="left:24px;bottom:24px;width:74px;height:48px"></div>
        <div class="block" style="left:126px;bottom:18px;width:66px;height:54px"></div>
        <div class="park" style="right:18px;bottom:20px;width:76px;height:50px"></div>
        <div class="water" style="left:-40px;bottom:86px;width:130px;height:40px;transform:rotate(-7deg)"></div>

        <div class="road major" style="left:-34px;top:146px;width:470px;transform:rotate(-7deg)"></div>
        <div class="road major" style="left:166px;top:-44px;width:360px;transform:rotate(78deg)"></div>
        <div class="road minor" style="left:14px;top:68px;width:242px;transform:rotate(12deg)"></div>
        <div class="road minor" style="left:36px;bottom:58px;width:310px;transform:rotate(-4deg)"></div>
        <div class="road minor" style="left:280px;top:0;width:268px;transform:rotate(88deg)"></div>

        <svg class="route-svg" viewBox="0 0 393 300" preserveAspectRatio="none">
          <path class="to-pickup" d="M49 244 C65 224 78 201 104 178"/>
          <path class="route-shadow" d="M104 178 C137 154 146 104 182 86 C212 71 229 123 252 125 C283 128 287 71 314 73 C341 75 349 123 365 147"/>
          <path class="route-main" d="M104 178 C137 154 146 104 182 86 C212 71 229 123 252 125 C283 128 287 71 314 73 C341 75 349 123 365 147"/>
        </svg>
        <div class="current"></div>
        <div class="you-label">You</div>
        <div class="pickup-pin">P</div>
        <div class="map-label pickup-map-label"><b>Pickup</b><span>Sukhumvit 39</span></div>
        <div class="stop-pin s1">1</div>
        <div class="stop-pin s2">2</div>
        <div class="stop-pin s3">3</div>
        <div class="stop-pin s4">4</div>
        <div class="map-label end-map-label"><b>Ends in Sathorn</b></div>
      </div>
    </section>

    <section class="decision-context" aria-label="Round details">
      <div class="trip-line"><span>Round</span><strong>18.6 km · ~58 min</strong></div>
      <div class="trip-line"><span>Ends</span><strong>Sathorn</strong></div>
      <div class="handling-row">
        <div class="handling">Flowers + cake · keep upright</div>
        <button class="areas-btn" id="areasBtn" type="button">View 4 stop areas <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <button class="accept" type="button" onclick="location.href='ROUNDS-D01-NAVIGATE-TO-PICKUP-v5-10OF10.html'">Accept Round · ฿420</button>
    <button class="decline" type="button" onclick="location.href='ROUNDS-B03-HOME-NETWORK-AVAILABLE-v8-10OF10.html'">Decline</button>
  </footer>

  <div class="sheet-backdrop" id="areasSheet" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Stop areas">
      <div class="sheet-head"><div class="sheet-title">4 stop areas</div><button class="sheet-close" id="closeSheet" type="button" aria-label="Close">×</button></div>
      <div class="area-row"><div class="area-num">1</div><div class="area-name">Thonglor</div><div class="area-time">Stop 1</div></div>
      <div class="area-row"><div class="area-num">2</div><div class="area-name">Asoke</div><div class="area-time">Stop 2</div></div>
      <div class="area-row"><div class="area-num">3</div><div class="area-name">Lumphini</div><div class="area-time">Stop 3</div></div>
      <div class="area-row"><div class="area-num">4</div><div class="area-name">Sathorn</div><div class="area-time">Final</div></div>
    </section>
  </div>
</div>
<script>
  const sheet = document.getElementById('areasSheet');
  const openSheet = () => { sheet.classList.add('show'); sheet.setAttribute('aria-hidden','false'); };
  const closeSheet = () => { sheet.classList.remove('show'); sheet.setAttribute('aria-hidden','true'); };
  document.getElementById('areasBtn').addEventListener('click', openSheet);
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e) => { if(e.target === sheet) closeSheet(); });
</script>
</body>
</html>
