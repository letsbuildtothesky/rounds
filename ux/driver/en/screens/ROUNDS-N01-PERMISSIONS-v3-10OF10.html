<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rounds — N01 Permissions v3</title>
<style>
:root{
  --canvas:#eef1f4;--paper:#fff;--ink:#172238;--ink2:#3d4a5d;--muted:#748094;
  --line:#e1e6ea;--line2:#cbd4dc;--orange:#ff6420;--orange-soft:#fff7f2;--green:#168b50;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
body{padding:28px}
.frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}
.statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:40}
.sb-right{display:flex;align-items:center;gap:6px}.signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}.battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}
.topbar{height:58px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}.step{font-size:12px;line-height:1;font-weight:830;letter-spacing:.075em;text-transform:uppercase;color:var(--muted)}
.main{position:absolute;inset:86px 0 0;display:flex;flex-direction:column;padding:30px 20px 24px;background:#fff}
.kicker{font-size:12px;line-height:1;font-weight:900;letter-spacing:.095em;text-transform:uppercase;color:var(--orange);margin-bottom:14px}
.icon{width:72px;height:72px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--orange);margin-bottom:30px}.icon svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:39px;line-height:.98;font-weight:870;letter-spacing:-.06em;max-width:330px}
.lead{margin:18px 0 0;font-size:17px;line-height:1.42;font-weight:650;color:var(--ink2);max-width:335px}
.truth{margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.truth-row{min-height:61px;display:flex;align-items:center;gap:13px}.truth-row+.truth-row{border-top:1px solid var(--line)}.truth-icon{width:26px;height:26px;display:grid;place-items:center;color:var(--green);flex:0 0 auto}.truth-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.truth-copy{font-size:14px;line-height:1.3;font-weight:770;color:var(--ink2)}
.actions{margin-top:auto}.primary{width:100%;height:62px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:17px;font-weight:860;letter-spacing:-.02em}.primary:active{transform:translateY(1px)}.secondary{width:100%;height:50px;border:0;background:#fff;color:var(--muted);font-size:14px;font-weight:790;margin-top:7px}.secondary:active{color:var(--ink)}
.notice{position:absolute;left:20px;right:20px;bottom:110px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:8px;font-size:13px;font-weight:760;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:90}.notice.show{opacity:1;transform:none}
@media(max-width:520px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(max-width:340px){.topbar{padding-left:16px;padding-right:16px}.main{padding:24px 16px 19px}.icon{width:64px;height:64px;margin-bottom:23px}.icon svg{width:29px;height:29px}h1{font-size:34px}.lead{margin-top:15px;font-size:15.5px;line-height:1.38}.truth{margin-top:22px}.truth-row{min-height:55px}.truth-copy{font-size:13px}.primary{height:58px}.secondary{height:45px}}
@media(max-height:720px){.main{padding-top:22px}.icon{width:60px;height:60px;margin-bottom:20px}.icon svg{width:27px;height:27px}h1{font-size:32px}.lead{margin-top:13px;font-size:15px}.truth{margin-top:18px}.truth-row{min-height:50px}.primary{height:56px}.secondary{height:42px}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="statusbar"><div>16:41</div><div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><div>5G</div><div class="battery"><b></b></div></div></div>
  <header class="topbar"><div class="brand">Rounds<span class="brand-dot"></span></div><div class="step" id="stepLabel">1 of 3</div></header>
  <main class="main">
    <div class="kicker">Permissions</div>
    <div class="icon" id="icon"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <section class="truth" id="truth"></section>
    <div class="actions">
      <button class="primary" id="primary"></button>
      <button class="secondary" id="secondary">Not now</button>
    </div>
  </main>
  <div class="notice" id="notice"></div>
</div>
<script>
const steps=[
  {
    title:'Location while using Rounds',
    lead:'Needed for navigation, arrival and accurate delivery ETAs.',
    button:'Allow location',
    icon:'<svg viewBox="0 0 24 24"><path d="M12 21s7-4.2 7-10a7 7 0 1 0-14 0c0 5.8 7 10 7 10Z"/><circle cx="12" cy="11" r="2.5"/></svg>',
    truths:[['<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>','Accurate route and arrival state'],['<svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="m14 6 6 6-6 6"/></svg>','Used only while working or open for jobs']]
  },
  {
    title:'Keep location active',
    lead:'Background location keeps the active delivery accurate when the screen locks or another app opens.',
    button:'Allow background location',
    icon:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h8M8 17h5"/></svg>',
    truths:[['<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>','Active Round keeps updating'],['<svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><path d="M6.5 7.5A7 7 0 0 0 12 19a7 7 0 0 0 4.5-1.6"/></svg>','Stops when shift and Network availability are off']]
  },
  {
    title:'Get operational alerts',
    lead:'Assignments, offers, route changes and Operations messages can reach you when Rounds is closed.',
    button:'Allow notifications',
    icon:'<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    truths:[['<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>','Work and route changes stay visible'],['<svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>','Camera and microphone are requested only when first used']]
  }
];
const params=new URLSearchParams(location.search);let step=Math.max(0,Math.min(2,(parseInt(params.get('step')||'1',10)||1)-1));
const label=document.getElementById('stepLabel'),icon=document.getElementById('icon'),title=document.getElementById('title'),lead=document.getElementById('lead'),truth=document.getElementById('truth'),primary=document.getElementById('primary'),secondary=document.getElementById('secondary'),notice=document.getElementById('notice');
function render(){const s=steps[step];label.textContent=`${step+1} of 3`;icon.innerHTML=s.icon;title.textContent=s.title;lead.textContent=s.lead;primary.textContent=s.button;secondary.textContent=step===2?'Finish without notifications':'Not now';truth.innerHTML=s.truths.map(([i,t])=>`<div class="truth-row"><span class="truth-icon">${i}</span><span class="truth-copy">${t}</span></div>`).join('')}
function flash(text){notice.textContent=text;notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),900)}
function advance(){if(step<2){step++;render()}else{flash('Setup complete');setTimeout(()=>{location.href='ROUNDS-B02-HOME-VERIFICATION-PENDING-v5-10OF10.html'},600)}}
primary.addEventListener('click',async()=>{
  if(step===0){try{navigator.geolocation?.getCurrentPosition(()=>{},()=>{}, {enableHighAccuracy:true,timeout:1500});}catch(e){} flash('Location permission requested');setTimeout(advance,360);return}
  if(step===1){flash('Background location permission requested');setTimeout(advance,360);return}
  if(step===2){try{if('Notification' in window && Notification.permission==='default') await Notification.requestPermission();}catch(e){} flash('Notification permission requested');setTimeout(advance,360)}
});
secondary.addEventListener('click',advance);render();
</script>
</body>
</html>
