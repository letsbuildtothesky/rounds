<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rounds — A01B Choose Language v1</title>
<style>
:root{
  --canvas:#eef1f4;--paper:#fff;--ink:#172238;--ink2:#3d4a5d;--muted:#748094;
  --line:#e1e6ea;--orange:#ff6420;--orange-soft:#fff5ef;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans Thai",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}button:focus-visible{outline:3px solid rgba(255,100,32,.16);outline-offset:2px}
body{padding:28px}
.frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}
.statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff}
.sb-right{display:flex;align-items:center;gap:6px}.signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}.battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}
.top{height:68px;padding:0 20px;display:flex;align-items:center;background:#fff}.brand{display:flex;align-items:flex-end;font-size:24px;line-height:1;font-weight:920;letter-spacing:-.055em}.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}
.body{padding:58px 20px 126px}.eyebrow{font-size:11.5px;line-height:1;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--orange);margin-bottom:17px}h1{margin:0;font-size:46px;line-height:.94;font-weight:885;letter-spacing:-.065em;max-width:345px}.lead{margin:18px 0 0;font-size:15px;line-height:1.45;font-weight:650;color:var(--muted);max-width:310px}
.language-list{margin-top:54px;border-top:1px solid var(--line)}
.language-row{width:100%;min-height:112px;border:0;border-bottom:1px solid var(--line);background:#fff;padding:0 4px 0 0;display:grid;grid-template-columns:4px minmax(0,1fr) 34px;gap:16px;align-items:center;text-align:left;color:var(--ink);cursor:pointer}
.language-row:active{background:#fafbfb}.language-row .edge{width:4px;height:54px;background:transparent}.language-row.selected .edge{background:var(--orange)}
.language-copy b{display:block;font-size:27px;line-height:1.02;font-weight:875;letter-spacing:-.04em}.language-copy span{display:block;margin-top:8px;font-size:13.5px;line-height:1.3;font-weight:690;color:var(--muted)}
.language-row[data-language="th"] .language-copy b{letter-spacing:0;font-weight:800}.language-row[data-language="th"] .language-copy span{letter-spacing:0}
.mark{width:28px;height:28px;border:1px solid #cbd4dc;border-radius:50%;display:grid;place-items:center}.mark:after{content:"";width:10px;height:10px;border-radius:50%;background:transparent}.language-row.selected .mark{border-color:var(--orange)}.language-row.selected .mark:after{background:var(--orange)}
.footer{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:#fff}.primary{width:100%;height:62px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:17px;font-weight:860;letter-spacing:-.02em;cursor:pointer}.primary:active{transform:translateY(1px)}
@media(max-width:520px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(max-width:340px){.body{padding:44px 18px 116px}.top{padding:0 18px}h1{font-size:42px}.language-list{margin-top:42px}.language-row{min-height:102px}.language-copy b{font-size:25px}.footer{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<div class="frame">
  <div class="statusbar"><span>9:41</span><div class="sb-right"><span class="signal"><i></i><i></i><i></i><i></i></span><span>5G</span><span class="battery"><b></b></span></div></div>
  <header class="top"><div class="brand">Rounds<span class="brand-dot"></span></div></header>
  <main class="body">
    <div class="eyebrow">First time</div>
    <h1>Choose your language</h1>
    <p class="lead">You can change this later in Profile.</p>

    <div class="language-list" role="radiogroup" aria-label="App language">
      <button class="language-row selected" data-language="en" role="radio" aria-checked="true">
        <span class="edge" aria-hidden="true"></span>
        <span class="language-copy"><b>English</b><span>English</span></span>
        <span class="mark" aria-hidden="true"></span>
      </button>
      <button class="language-row" data-language="th" role="radio" aria-checked="false">
        <span class="edge" aria-hidden="true"></span>
        <span class="language-copy"><b>ไทย</b><span>ภาษาไทย</span></span>
        <span class="mark" aria-hidden="true"></span>
      </button>
    </div>
  </main>
  <footer class="footer"><button class="primary" id="continueBtn">Continue in English</button></footer>
</div>
<script>
const rows=[...document.querySelectorAll('.language-row')];
const continueBtn=document.getElementById('continueBtn');
function getSavedLanguage(){try{return localStorage.getItem('rounds.language')}catch(e){return null}}
function saveLanguage(v){try{localStorage.setItem('rounds.language',v)}catch(e){}}
let selected=getSavedLanguage()==='th'?'th':'en';
function render(){
  document.documentElement.lang=selected;
  rows.forEach(row=>{const on=row.dataset.language===selected;row.classList.toggle('selected',on);row.setAttribute('aria-checked',String(on))});
  continueBtn.textContent=selected==='th'?'ดำเนินการต่อ':'Continue in English';
}
rows.forEach(row=>row.addEventListener('click',()=>{selected=row.dataset.language;render()}));
continueBtn.addEventListener('click',()=>{
  saveLanguage(selected);
  location.href=`ROUNDS-A02-A05-DRIVER-ENTRY-FLOW-v6-10OF10.html?lang=${selected}`;
});
render();
</script>
</body>
</html>
