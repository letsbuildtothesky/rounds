.section{padding:21px 20px 4px}.section-title{font-size:14px;font-weight:880;letter-spacing:-.02em;margin-bottom:8px}.ledger{border-top:1px solid var(--line)}.row{width:100%;min-height:65px;padding:0;border:0;border-bottom:1px solid var(--line);background:#fff;color:inherit;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;text-align:left}.row:active{background:#fafbfb}.row-main{min-width:0}.row-main b{display:block;font-size:15px;line-height:1.2;font-weight:850;letter-spacing:-.018em}.row-main span{display:block;margin-top:6px;font-size:12.5px;line-height:1.3;font-weight:710;color:var(--muted)}.row-side{display:flex;align-items:center;gap:9px;flex:0 0 auto}.row-value{font-size:12.5px;line-height:1.2;font-weight:780;color:var(--muted);text-align:right}.row-value.good{color:var(--green)}.row-value.orange{color:var(--orange)}.chev{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.danger .row-main b{color:var(--red)}
.work-line{padding:17px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.work-line b{display:block;font-size:16px;font-weight:860;letter-spacing:-.02em}.work-line span{display:block;margin-top:6px;font-size:12.5px;font-weight:710;color:var(--muted)}.work-state{font-size:12.5px;font-weight:830;color:var(--green)}
.bottomnav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px 9px;z-index:40}.nav-item{color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:720;border:0;background:#fff}.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav-item.active{color:var(--orange)}
.scrim{position:absolute;inset:0;background:rgba(10,18,31,.28);opacity:0;pointer-events:none;transition:.18s;z-index:70}.scrim.show{opacity:1;pointer-events:auto}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;transform:translateY(105%);transition:.22s ease;z-index:80;padding:10px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -18px 42px rgba(23,34,56,.15)}.sheet.show{transform:none}.grab{width:38px;height:4px;border-radius:999px;background:#d7dde2;margin:0 auto 18px}.sheet-kicker{font-size:11.5px;line-height:1;font-weight:890;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}.sheet h3{margin:0;font-size:28px;line-height:1;letter-spacing:-.045em;font-weight:860}.sheet-sub{margin-top:8px;font-size:13.5px;line-height:1.35;font-weight:720;color:var(--muted)}.sheet-list{margin-top:20px;border-top:1px solid var(--line)}.sheet-row{min-height:57px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.sheet-row span{font-size:13px;font-weight:720;color:var(--muted)}.sheet-row b{font-size:14px;font-weight:830;text-align:right}.sheet-choice{width:100%;min-height:58px;padding:0;border:0;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;color:inherit}.sheet-choice:active{background:#fafbfb}.sheet-choice b{font-size:15px;font-weight:840}.sheet-choice span{font-size:12.5px;font-weight:760;color:var(--muted)}.sheet-choice.selected span{color:var(--orange)}.field{margin-top:17px}.field label{display:block;margin-bottom:7px;font-size:12.5px;font-weight:780;color:var(--muted)}.field input{width:100%;height:54px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink);padding:0 14px;font-size:15px;font-weight:720;outline:none}.field input:focus{border-color:#a8b5c1}.toggle-row{min-height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.toggle-copy b{display:block;font-size:14.5px;font-weight:840}.toggle-copy span{display:block;margin-top:5px;font-size:12px;line-height:1.3;font-weight:700;color:var(--muted)}.switch{width:48px;height:28px;padding:3px;border:0;border-radius:16px;background:#d8dee4;flex:0 0 auto}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(23,34,56,.2)}.switch.on{background:var(--green)}.switch.on i{transform:translateX(20px)}.sheet-primary{width:100%;height:56px;margin-top:18px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:16px;font-weight:850}.sheet-secondary{width:100%;height:52px;margin-top:9px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink2);font-size:15px;font-weight:830}.sheet-danger{width:100%;height:56px;margin-top:18px;border:0;border-radius:7px;background:var(--red);color:#fff;font-size:16px;font-weight:850}.toast{position:absolute;left:18px;right:18px;bottom:92px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:8px;font-size:13.5px;font-weight:760;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:90}.toast.show{opacity:1;transform:none}

<script>
const params=new URLSearchParams(location.search);
function getSavedLanguage(){try{return localStorage.getItem('rounds.language')}catch(e){return null}}
function saveLanguagePreference(v){try{localStorage.setItem('rounds.language',v)}catch(e){}}
const context=['team','network','hybrid'].includes(params.get('context'))?params.get('context'):'hybrid';
let driverName='Somchai Prasert',driverPhone='+66 81 234 4821',vehicle='Motorbike + box',plate='1กข 4821',payout='PromptPay · •••• 4821',language=getSavedLanguage()==='th'?'ไทย':'English',merchantContact=true,askAvailability=true;
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),sheetKicker=document.getElementById('sheetKicker'),sheetTitle=document.getElementById('sheetTitle'),sheetSub=document.getElementById('sheetSub'),sheetBody=document.getElementById('sheetBody'),toast=document.getElementById('toast');
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function initials(name){return name.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'DR'}
function openSheet({kicker='Profile',title,sub='',html=''}){sheetKicker.textContent=kicker;sheetTitle.textContent=title;sheetSub.textContent=sub;sheetBody.innerHTML=html;scrim.classList.add('show');sheet.classList.add('show')}
function closeSheet(){scrim.classList.remove('show');sheet.classList.remove('show')}
scrim.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function updateIdentity(){document.getElementById('profileName').textContent=driverName;document.getElementById('profilePhone').textContent=driverPhone;document.getElementById('avatar').textContent=initials(driverName)}
function updateDriverRows(){document.getElementById('vehicleSub').textContent=`${vehicle} · ${plate}`;document.getElementById('payoutSub').textContent=payout;document.getElementById('languageValue').textContent=language;document.getElementById('networkPrefValue').textContent=(merchantContact||askAvailability)?'On':'Off'}
function renderContext(){
  const holder=document.getElementById('workContext');
  const team=`<div class="work-line"><div><b>UrbanFlowers</b><span>Team driver · Sukhumvit 39</span></div><div class="work-state">Active</div></div>`;
  const network=`<div class="work-line"><div><b>Rounds Network</b><span>Independent driver</span></div><div class="work-state">Approved</div></div>`;
  holder.innerHTML=context==='team'?team:context==='network'?network:team+network;
  document.querySelectorAll('.network-only').forEach(el=>el.style.display=context==='team'?'none':'grid');
  const home=document.getElementById('homeNav'),jobs=document.getElementById('jobsNav'),role=document.getElementById('roleNav'),label=document.getElementById('roleLabel'),icon=document.getElementById('roleIcon');
  if(context==='network'){
    home.href='ROUNDS-B03-HOME-NETWORK-AVAILABLE-v8-10OF10.html';jobs.href='ROUNDS-J01-MY-ROUNDS-v7-10OF10.html?context=network';role.href='ROUNDS-K01-EARNINGS-v3-10OF10.html';label.textContent='Earnings';icon.innerHTML='<path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7H14.5a3.5 3.5 0 0 1 0 7H6"/>';document.getElementById('notificationsTop').href='ROUNDS-M01-NOTIFICATIONS-v2-10OF10.html?context=network';document.getElementById('notificationsRow').href='ROUNDS-M01-NOTIFICATIONS-v2-10OF10.html?context=network';
  }else{jobs.href='ROUNDS-J01-MY-ROUNDS-v7-10OF10.html?context=team';document.getElementById('notificationsTop').href='ROUNDS-M01-NOTIFICATIONS-v2-10OF10.html?context=team';document.getElementById('notificationsRow').href='ROUNDS-M01-NOTIFICATIONS-v2-10OF10.html?context=team'}
}
renderContext();updateIdentity();updateDriverRows();

document.getElementById('editIdentity').onclick=()=>openSheet({title:'Edit profile',html:`<div class="field"><label>Name</label><input id="nameInput" value="${driverName.replace(/"/g,'&quot;')}"></div><div class="field"><label>Phone</label><input id="phoneInput" value="${driverPhone.replace(/"/g,'&quot;')}"></div><button class="sheet-primary" id="saveIdentity">Save changes</button>`});
document.addEventListener('click',e=>{if(e.target.id==='saveIdentity'){driverName=document.getElementById('nameInput').value.trim()||driverName;driverPhone=document.getElementById('phoneInput').value.trim()||driverPhone;updateIdentity();closeSheet();showToast('Profile updated')}});

document.getElementById('vehicleRow').onclick=()=>openSheet({kicker:'Vehicle',title:vehicle,sub:plate,html:`<div class="sheet-list">${['Motorbike + box','Tuk-tuk','Car','Pickup','Van'].map(v=>`<button class="sheet-choice ${v===vehicle?'selected':''}" data-vehicle="${v}"><b>${v}</b><span>${v===vehicle?'Current':'Select'}</span></button>`).join('')}</div>`});
document.addEventListener('click',e=>{const b=e.target.closest('[data-vehicle]');if(!b)return;vehicle=b.dataset.vehicle;updateDriverRows();closeSheet();showToast('Vehicle updated')});

document.getElementById('documentsRow').onclick=()=>openSheet({kicker:'Verification',title:'Verified driver',sub:'Account verification is complete',html:`<div class="sheet-list"><div class="sheet-row"><span>Status</span><b style="color:var(--green)">Verified</b></div><div class="sheet-row"><span>Driver</span><b>${driverName}</b></div></div><button class="sheet-primary" id="doneSheet">Done</button>`});

document.getElementById('payoutRow').onclick=()=>openSheet({kicker:'Network payout',title:'Payout method',sub:payout,html:`<div class="sheet-list"><button class="sheet-choice ${payout.startsWith('PromptPay')?'selected':''}" data-payout="PromptPay · •••• 4821"><b>PromptPay</b><span>${payout.startsWith('PromptPay')?'Current':'Select'}</span></button><button class="sheet-choice ${payout.startsWith('Bank')?'selected':''}" data-payout="Bank account · •••• 2048"><b>Bank account</b><span>${payout.startsWith('Bank')?'Current':'Select'}</span></button></div>`});
document.addEventListener('click',e=>{const b=e.target.closest('[data-payout]');if(!b)return;payout=b.dataset.payout;updateDriverRows();closeSheet();showToast('Payout method updated')});

document.getElementById('networkPrefsRow').onclick=()=>openSheet({kicker:'Network',title:'Merchant contact',sub:'Your Network preferences',html:`<div class="sheet-list"><div class="toggle-row"><div class="toggle-copy"><b>Known merchants can message me</b><span>Preferred / known relationships only</span></div><button class="switch ${merchantContact?'on':''}" id="merchantContactSwitch" aria-label="Toggle merchant contact"><i></i></button></div><div class="toggle-row"><div class="toggle-copy"><b>Ask availability</b><span>Allow structured availability requests</span></div><button class="switch ${askAvailability?'on':''}" id="availabilitySwitch" aria-label="Toggle availability requests"><i></i></button></div></div><button class="sheet-primary" id="saveNetworkPrefs">Done</button>`});
document.addEventListener('click',e=>{if(e.target.closest('#merchantContactSwitch')){merchantContact=!merchantContact;e.target.closest('#merchantContactSwitch').classList.toggle('on',merchantContact)}if(e.target.closest('#availabilitySwitch')){askAvailability=!askAvailability;e.target.closest('#availabilitySwitch').classList.toggle('on',askAvailability)}if(e.target.id==='saveNetworkPrefs'){updateDriverRows();closeSheet();showToast('Network preferences updated')}});

document.getElementById('languageRow').onclick=()=>openSheet({kicker:'Language',title:'App language',html:`<div class="sheet-list"><button class="sheet-choice ${language==='English'?'selected':''}" data-language="English"><b>English</b><span>${language==='English'?'Selected':'Select'}</span></button><button class="sheet-choice ${language==='ไทย'?'selected':''}" data-language="ไทย"><b>ไทย</b><span>${language==='ไทย'?'เลือกแล้ว':'เลือก'}</span></button></div>`});
document.addEventListener('click',e=>{const b=e.target.closest('[data-language]');if(!b)return;language=b.dataset.language;saveLanguagePreference(language==='ไทย'?'th':'en');updateDriverRows();closeSheet();showToast('Language preference saved')});

document.getElementById('supportRow').onclick=()=>openSheet({kicker:'Support',title:'Help & support',html:`<div class="sheet-list"><a class="sheet-choice" href="ROUNDS-H01-OPERATOR-CHAT-v4-10OF10.html" style="text-decoration:none;color:inherit"><b>Message Operations</b><span>Open chat</span></a><a class="sheet-choice" href="ROUNDS-H02-CALL-CONTACT-v2-10OF10.html" style="text-decoration:none;color:inherit"><b>Call Operations</b><span>Rounds voice</span></a></div>`});
document.getElementById('signOutRow').onclick=()=>openSheet({kicker:'Account',title:'Sign out?',sub:'You will return to the Driver entry screen.',html:`<button class="sheet-danger" id="confirmSignOut">Sign out</button><button class="sheet-secondary" id="cancelSignOut">Cancel</button>`});
document.addEventListener('click',e=>{if(e.target.id==='confirmSignOut')location.href='ROUNDS-A02-A05-DRIVER-ENTRY-FLOW-v6-10OF10.html';if(e.target.id==='cancelSignOut'||e.target.id==='doneSheet')closeSheet()});
</script>
</body>
</html>
