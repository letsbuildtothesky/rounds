<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rounds — B01C Shift Complete / Network v2</title>
<style>
  :root{
    --canvas:#eef1f4;
    --paper:#ffffff;
    --ink:#172238;
    --ink-2:#3d4a5d;
    --muted:#748094;
    --line:#e1e6ea;
    --line-2:#cbd4dc;
    --orange:#ff6420;
    --green:#168b50;
    --green-soft:#edf8f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,a{font:inherit}
  body{padding:28px}
  .frame{width:393px;height:852px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}
  .statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:20}
  .sb-right{display:flex;align-items:center;gap:6px}.signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}.battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}
  .topbar{height:58px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20}
  .brand{display:flex;align-items:flex-end;font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:3px;margin-bottom:2px}.icon-btn{width:38px;height:38px;border:0;background:#fff;color:var(--ink-2);display:grid;place-items:center;text-decoration:none;border-radius:7px}.icon-btn:hover{background:#f8f9fa}.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .body{position:absolute;inset:86px 0 76px;display:flex;flex-direction:column;background:#fff}
  .hero{padding:34px 20px 28px;border-bottom:1px solid var(--line)}
  .state-line{display:flex;align-items:center;gap:9px;color:var(--green);font-size:14px;font-weight:780}.state-mark{width:18px;height:18px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center}.state-mark svg{width:11px;height:11px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:17px 0 0;font-size:35px;line-height:1.02;letter-spacing:-.055em;font-weight:880}
  .team{margin-top:10px;font-size:18px;line-height:1.2;font-weight:740;color:var(--ink-2)}
  .shift-time{margin-top:26px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.shift-range{font-size:26px;line-height:1;font-weight:840;letter-spacing:-.035em}.shift-range span{display:block;margin-top:7px;font-size:12px;line-height:1;color:var(--muted);font-weight:720;letter-spacing:0}.hours-link{color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:760;display:flex;align-items:center;gap:5px;padding-bottom:2px}.hours-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .network{padding:28px 20px 24px;border-bottom:1px solid var(--line)}
  .section-label{font-size:11.5px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .availability-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.availability-copy{min-width:0}.availability-title{font-size:28px;line-height:1.05;font-weight:850;letter-spacing:-.04em}.availability-state{margin-top:7px;font-size:13.5px;line-height:1.2;color:var(--muted);font-weight:690}
  .switch{width:76px;height:44px;border:0;border-radius:22px;background:#d9e0e5;position:relative;cursor:pointer;flex:0 0 auto;transition:.18s ease;box-shadow:inset 0 0 0 1px rgba(23,34,56,.05)}.switch:before{content:"";position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(23,34,56,.15);transition:.18s ease}.switch.on{background:var(--green)}.switch.on:before{transform:translateX(32px)}
  .spacer{flex:1 1 auto;min-height:40px}
  .dispatch{padding:18px 20px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.dispatch-copy{min-width:0}.dispatch-label{font-size:11.5px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.dispatch-name{font-size:14px;line-height:1.1;font-weight:780}.dispatch-actions{display:flex;gap:7px}.utility{width:40px;height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink-2);display:grid;place-items:center;text-decoration:none}.utility:hover{border-color:var(--line-2);background:#fafbfc}.utility svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bottomnav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px 9px;z-index:40}.nav-item{color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:720;border:0;background:#fff;cursor:pointer}.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav-item.active{color:var(--orange)}
  @media(max-width:460px){body{padding:0;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="statusbar">
    <span>17:04</span>
    <div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"><b></b></div></div>
  </div>

  <div class="topbar">
    <div class="brand">Rounds<span class="brand-dot"></span></div>
    <a class="icon-btn" href="ROUNDS-M01-NOTIFICATIONS-v2-10OF10.html" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </a>
  </div>

  <main class="body">
    <section class="hero">
      <div class="state-line">
        <span class="state-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></svg></span>
        <span>Shift complete</span>
      </div>
      <h1>Done for today</h1>
      <div class="team">UrbanFlowers</div>
      <div class="shift-time">
        <div class="shift-range">08:00–17:00<span>Team shift</span></div>
        <a class="hours-link" href="ROUNDS-K00-TEAM-HOURS-v5-10OF10.html">View hours <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      </div>
    </section>

    <section class="network" aria-label="Network availability">
      <div class="section-label">Network</div>
      <div class="availability-row">
        <div class="availability-copy">
          <div class="availability-title">Open for jobs</div>
          <div class="availability-state" id="availabilityState">Not accepting jobs</div>
        </div>
        <button class="switch" id="networkSwitch" type="button" aria-label="Open for Network jobs" aria-pressed="false"></button>
      </div>
    </section>

    <div class="spacer"></div>

    <section class="dispatch" aria-label="Dispatch contact">
      <div class="dispatch-copy">
        <div class="dispatch-label">Dispatch</div>
        <div class="dispatch-name">UrbanFlowers</div>
      </div>
      <div class="dispatch-actions">
        <a class="utility" href="ROUNDS-H01-OPERATOR-CHAT-v4-10OF10.html" aria-label="Message dispatch">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
        </a>
        <a class="utility" href="ROUNDS-H02-CALL-CONTACT-v2-10OF10.html" aria-label="Call dispatch">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.89.33 1.76.63 2.59a2 2 0 0 1-.45 2.11L8 9.91a16 16 0 0 0 6.09 6.09l1.49-1.29a2 2 0 0 1 2.11-.45c.83.3 1.7.51 2.59.63A2 2 0 0 1 22 16.92Z"/></svg>
        </a>
      </div>
    </section>
  </main>

  <nav class="bottomnav" aria-label="Primary">
    <a class="nav-item active" href="#" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Home</span>
    </a>
    <a class="nav-item" href="ROUNDS-J01-MY-ROUNDS-v7-10OF10.html">
      <svg viewBox="0 0 24 24"><path d="M12 20s7-3.6 7-9a7 7 0 1 0-14 0c0 5.4 7 9 7 9Z"/><circle cx="12" cy="11" r="2.5"/></svg><span>Jobs</span>
    </a>
    <a class="nav-item" href="ROUNDS-K00-TEAM-HOURS-v5-10OF10.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Hours</span>
    </a>
    <a class="nav-item" href="ROUNDS-L01-DRIVER-PROFILE-v3-10OF10.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span>
    </a>
  </nav>
</div>

<script>
  const networkSwitch = document.getElementById('networkSwitch');
  const availabilityState = document.getElementById('availabilityState');
  let navigating = false;

  networkSwitch.addEventListener('click', () => {
    if(navigating) return;
    const on = !networkSwitch.classList.contains('on');
    networkSwitch.classList.toggle('on', on);
    networkSwitch.setAttribute('aria-pressed', String(on));
    availabilityState.textContent = on ? 'Open for jobs' : 'Not accepting jobs';

    if(on){
      navigating = true;
      setTimeout(() => {
        window.location.href = 'ROUNDS-B03-HOME-NETWORK-AVAILABLE-v8-10OF10.html';
      }, 320);
    }
  });
</script>
</body>
</html>
