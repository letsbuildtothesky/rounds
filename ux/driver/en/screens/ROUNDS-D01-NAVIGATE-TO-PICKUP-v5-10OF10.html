<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rounds — D01 Navigate to Pickup v5</title>
<style>
  :root{
    --canvas:#eef1f4;
    --paper:#fff;
    --ink:#172238;
    --ink2:#3d4a5d;
    --muted:#748094;
    --line:#e1e6ea;
    --line2:#cbd4dc;
    --orange:#ff6420;
    --green:#168b50;
    --red:#bf4a4a;
    --blue:#2f6fbd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,a{font:inherit}
  body{padding:28px}
  .frame{width:393px;height:852px;margin:0 auto;background:#f2f5f7;position:relative;overflow:hidden;border:1px solid rgba(23,34,56,.09);border-radius:28px;box-shadow:0 18px 42px rgba(23,34,56,.14)}

  .statusbar{height:28px;padding:0 20px 4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;font-weight:760;background:#fff;position:relative;z-index:50}
  .sb-right{display:flex;align-items:center;gap:6px}.signal{display:flex;align-items:flex-end;gap:1.5px;height:9px}.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}
  .battery{width:20px;height:9px;border:1.5px solid currentColor;border-radius:2px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:currentColor}.battery b{display:block;width:78%;height:100%;background:currentColor;border-radius:1px}

  .screen{position:absolute;inset:28px 0 0;overflow:hidden;background:#eef2f4}
  #map,.fallback-map{position:absolute;inset:0}
  #map{z-index:1;background:#eef2f4;display:none}
  .live-map #map{display:block}
  .live-map .fallback-map{display:none}
  .fallback-map{z-index:0;background:linear-gradient(180deg,#f5f7f8 0%,#edf2f4 100%)}
  .fallback-map .block{position:absolute;background:#e4e9ec;border-radius:4px;opacity:.9}.fallback-map .park{position:absolute;background:#e3efe6;border-radius:4px}.fallback-map .road{position:absolute;background:#fff;box-shadow:0 0 0 1px #dce3e8;border-radius:999px;transform-origin:center}.fallback-map .road.major{height:13px}.fallback-map .road.minor{height:7px}
  .fallback-route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.fallback-route .shadow{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.fallback-route .main{fill:none;stroke:var(--orange);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .fallback-place{position:absolute;font-size:11px;font-weight:760;color:#8792a0;letter-spacing:.02em}

  .mapboxgl-ctrl-logo,.mapboxgl-ctrl-attrib{opacity:.55}.mapboxgl-ctrl-bottom-right{right:8px;bottom:142px}.mapboxgl-canvas{outline:none}

  .top-instrument{position:absolute;top:12px;left:12px;right:12px;z-index:20;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:start}
  .road-button{width:44px;height:44px;border:1px solid rgba(203,212,220,.95);border-radius:6px;background:rgba(255,255,255,.97);color:var(--ink);display:grid;place-items:center;box-shadow:0 7px 18px rgba(23,34,56,.08);cursor:pointer;backdrop-filter:blur(12px)}
  .road-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .instruction{min-height:82px;background:var(--ink);color:#fff;border-radius:7px;box-shadow:0 12px 26px rgba(23,34,56,.18);display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:10px 13px 10px 10px}
  .turn-mark{width:48px;height:48px;border-radius:6px;background:var(--orange);display:grid;place-items:center}.turn-mark svg{width:27px;height:27px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .instruction-copy{min-width:0}.instruction-distance{font-size:30px;line-height:.95;font-weight:870;letter-spacing:-.055em}.instruction-distance small{font-size:13px;font-weight:720;letter-spacing:0;color:rgba(255,255,255,.65);margin-left:3px}.instruction-text{margin-top:6px;font-size:13.5px;line-height:1.28;font-weight:690;color:rgba(255,255,255,.86);white-space:normal}

  .pickup-marker{width:36px;height:36px;border-radius:50%;background:var(--orange);border:4px solid #fff;box-shadow:0 0 0 1px rgba(23,34,56,.08),0 6px 16px rgba(23,34,56,.18);display:grid;place-items:center;color:#fff}
  .pickup-marker svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .pickup-label{position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:5px;padding:5px 8px;color:var(--ink);font-size:12px;font-weight:790;box-shadow:0 5px 14px rgba(23,34,56,.07)}
  .driver-marker{width:35px;height:35px;display:grid;place-items:center;filter:drop-shadow(0 6px 12px rgba(23,34,56,.20))}.driver-marker svg{width:35px;height:43px;overflow:visible}
  .entrance-tag{display:none;position:absolute;z-index:10;left:50%;top:47px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:11.5px;font-weight:780;color:var(--ink2)}
  .near .entrance-tag{display:block}

  .action-scrim{position:absolute;inset:0;z-index:27;background:rgba(23,34,56,.18);opacity:0;pointer-events:none;transition:opacity .16s ease}
  .action-scrim.show{opacity:1;pointer-events:auto}
  .action-sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:30;background:#fff;border:1px solid var(--line2);border-radius:12px 12px 8px 8px;box-shadow:0 20px 48px rgba(23,34,56,.20);overflow:hidden;transform:translateY(calc(100% + 18px));opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.22,.72,.24,1),opacity .16s ease}
  .action-sheet.show{transform:translateY(0);opacity:1;pointer-events:auto}
  .sheet-handle{height:22px;display:grid;place-items:center;background:#fff}.sheet-handle:after{content:"";width:38px;height:4px;border-radius:99px;background:#ccd4dc}
  .sheet-action{width:100%;min-height:64px;padding:0 18px;border:0;border-top:1px solid var(--line);background:#fff;color:var(--ink);display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;font-size:16px;font-weight:790;text-align:left;cursor:pointer}
  .sheet-action:first-of-type{border-top:0}.sheet-action:hover{background:#f7f9fa}.sheet-action:active{background:#f1f4f6}.sheet-action svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sheet-action.issue{color:var(--red)}

  .pickup-dock{position:absolute;left:12px;right:12px;bottom:12px;z-index:18;background:rgba(255,255,255,.985);border:1px solid var(--line2);border-radius:8px;box-shadow:0 14px 34px rgba(23,34,56,.14);backdrop-filter:blur(12px);overflow:hidden}
  .pickup-row{min-height:92px;padding:15px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
  .dock-kicker{font-size:11px;line-height:1;font-weight:820;letter-spacing:.085em;text-transform:uppercase;color:var(--orange)}.dock-title{margin-top:6px;font-size:22px;line-height:1.02;font-weight:830;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dock-place{margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock-distance{text-align:right;white-space:nowrap}.dock-distance strong{display:block;font-size:24px;line-height:1;font-weight:850;letter-spacing:-.045em}.dock-distance span{display:block;margin-top:6px;font-size:12px;color:var(--muted);font-weight:700}
  .arrive{display:none;width:calc(100% - 20px);height:60px;margin:0 10px 10px;border:0;border-radius:7px;background:var(--green);color:#fff;font-size:17px;font-weight:820;cursor:pointer}.near .arrive{display:block}

  .loading-note{position:absolute;left:50%;top:112px;z-index:12;transform:translateX(-50%);padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.94);font-size:11.5px;font-weight:740;color:var(--muted);box-shadow:0 5px 14px rgba(23,34,56,.05)}.loading-note.hidden{display:none}

  @media(max-width:350px){
    .top-instrument{left:9px;right:9px;grid-template-columns:42px minmax(0,1fr) 42px;gap:6px}.road-button{width:42px;height:42px}.instruction{min-height:78px;grid-template-columns:43px minmax(0,1fr);gap:9px;padding:9px 10px 9px 8px}.turn-mark{width:43px;height:43px}.instruction-distance{font-size:27px}.instruction-text{font-size:12.5px}.pickup-dock{left:9px;right:9px;bottom:9px}.pickup-row{min-height:84px;padding:13px}.dock-title{font-size:20px}.dock-distance strong{font-size:21px}
  }
  @media(max-width:460px){body{padding:0;background:#eef2f4}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="statusbar"><span>11:06</span><div class="sb-right"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"><b></b></div></div></div>
  <main class="screen">
    <div class="fallback-map" aria-hidden="true">
      <div class="block" style="left:18px;top:155px;width:82px;height:52px"></div><div class="block" style="left:119px;top:153px;width:78px;height:60px"></div><div class="block" style="right:20px;top:162px;width:80px;height:48px"></div>
      <div class="block" style="left:25px;bottom:170px;width:78px;height:54px"></div><div class="park" style="right:28px;bottom:182px;width:88px;height:70px"></div><div class="block" style="left:143px;bottom:158px;width:78px;height:60px"></div>
      <div class="road major" style="left:-30px;top:310px;width:460px;transform:rotate(-7deg)"></div><div class="road major" style="left:205px;top:90px;width:520px;transform:rotate(79deg)"></div><div class="road minor" style="left:6px;top:222px;width:360px;transform:rotate(10deg)"></div><div class="road minor" style="left:52px;bottom:225px;width:310px;transform:rotate(-2deg)"></div><div class="road minor" style="left:78px;top:96px;width:470px;transform:rotate(88deg)"></div>
      <svg class="fallback-route" viewBox="0 0 393 824" preserveAspectRatio="none"><path class="shadow" d="M86 610 C104 560 140 512 154 455 C167 400 190 357 233 328 C267 305 300 276 322 234"/><path class="main" d="M86 610 C104 560 140 512 154 455 C167 400 190 357 233 328 C267 305 300 276 322 234"/></svg>
      <span class="fallback-place" style="left:19px;top:235px">PHROM PHONG</span><span class="fallback-place" style="right:20px;top:285px">SUKHUMVIT 39</span>
      <div style="position:absolute;left:84px;bottom:190px;transform:translate(-50%,-50%);width:35px;height:43px;filter:drop-shadow(0 6px 12px rgba(23,34,56,.20))"><svg viewBox="0 0 36 44" width="35" height="43"><path d="M18 2 33 40 18 34 3 40Z" fill="#172238" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>
      <div style="position:absolute;right:48px;top:220px;width:36px;height:36px;border-radius:50%;background:#ff6420;border:4px solid #fff;box-shadow:0 0 0 1px rgba(23,34,56,.08),0 6px 16px rgba(23,34,56,.18);display:grid;place-items:center;color:#fff"><svg viewBox="0 0 24 24" width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/></svg><span style="position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.97);border:1px solid #e1e6ea;border-radius:5px;padding:5px 8px;color:#172238;font-size:12px;font-weight:790;box-shadow:0 5px 14px rgba(23,34,56,.07)">UrbanFlowers</span></div>
    </div>
    <div id="map" aria-label="Navigation map to pickup"></div>
    <div class="loading-note" id="loadingNote">Loading live map…</div>

    <div class="top-instrument">
      <button class="road-button" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="instruction" aria-live="polite">
        <div class="turn-mark"><svg viewBox="0 0 24 24"><path d="M6 18h3a5 5 0 0 0 5-5V6"/><path d="M10 9l4-4 4 4"/></svg></div>
        <div class="instruction-copy"><div class="instruction-distance" id="turnDistance">320 <small>m</small></div><div class="instruction-text" id="turnText">Turn left into Sukhumvit 39</div></div>
      </div>
      <button class="road-button" id="menuBtn" aria-label="More actions"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    </div>

    <div class="action-scrim" id="actionScrim" aria-hidden="true"></div>
    <div class="action-sheet" id="actionSheet" role="dialog" aria-modal="true" aria-label="Pickup actions" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <a class="sheet-action" href="tel:+6625554400"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/></svg><span>Call pickup</span></a>
      <a class="sheet-action" href="ROUNDS-H01-OPERATOR-CHAT-v4-10OF10.html"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg><span>Message Operations</span></a>
      <a class="sheet-action issue" href="ROUNDS-G02-ADDRESS-PROBLEM-v2-10OF10.html"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.6 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/></svg><span>Report an issue</span></a>
      <a class="sheet-action" id="externalMaps" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg><span>Open in Maps</span></a>
    </div>

    <section class="pickup-dock" aria-label="Pickup status">
      <div class="pickup-row">
        <div><div class="dock-kicker" id="dockKicker">Pickup</div><div class="dock-title">UrbanFlowers</div><div class="dock-place" id="dockPlace">Sukhumvit 39</div></div>
        <div class="dock-distance"><strong id="eta">6 min</strong><span id="distance">1.2 km</span></div>
      </div>
      <button class="arrive" id="arriveBtn" type="button">I'm at pickup</button>
    </section>
  </main>
</div>
<script>
  const TOKEN='MAPBOX_PUBLIC_TOKEN_REQUIRED';
  const PICKUP=[100.5766,13.7338];
  const START=[100.5664,13.7317];
  const NEAR=[100.5757,13.7334];
  const params=new URLSearchParams(location.search);
  const state=params.get('state')==='near'?'near':'enroute';
  const current=state==='near'?NEAR:START;
  const frame=document.getElementById('frame');
  const actionSheet=document.getElementById('actionSheet');
  const actionScrim=document.getElementById('actionScrim');
  const menuBtn=document.getElementById('menuBtn');
  const loadingNote=document.getElementById('loadingNote');
  if(state==='near'){
    frame.classList.add('near');
    document.getElementById('turnDistance').innerHTML='80 <small>m</small>';
    document.getElementById('turnText').textContent='UrbanFlowers entrance ahead';
    document.getElementById('dockKicker').textContent='Almost there';
    document.getElementById('dockPlace').textContent='Entrance on your left';
    document.getElementById('eta').textContent='1 min';
    document.getElementById('distance').textContent='80 m';
  }
  document.getElementById('externalMaps').href=`https://www.google.com/maps/dir/?api=1&destination=${PICKUP[1]},${PICKUP[0]}`;
  document.getElementById('backBtn').addEventListener('click',()=>{ if(history.length>1) history.back(); else location.href='ROUNDS-B01B-TEAM-HOME-ROUND-ASSIGNED-v3-10OF10.html'; });
  function setActionSheet(open){
    actionSheet.classList.toggle('show',open);
    actionScrim.classList.toggle('show',open);
    actionSheet.setAttribute('aria-hidden',String(!open));
    actionScrim.setAttribute('aria-hidden',String(!open));
    menuBtn.setAttribute('aria-expanded',String(open));
  }
  menuBtn.setAttribute('aria-haspopup','dialog');
  menuBtn.setAttribute('aria-expanded','false');
  menuBtn.addEventListener('click',e=>{e.stopPropagation();setActionSheet(!actionSheet.classList.contains('show'))});
  actionScrim.addEventListener('click',()=>setActionSheet(false));
  actionSheet.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setActionSheet(false)));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')setActionSheet(false)});
  document.getElementById('arriveBtn').addEventListener('click',()=>location.href='ROUNDS-D03-D04-PICKUP-CONFIRM-v6-10OF10.html');

  function driverEl(){
    const el=document.createElement('div');el.className='driver-marker';
    el.innerHTML='<svg viewBox="0 0 36 44"><path d="M18 2 33 40 18 34 3 40Z" fill="#172238" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
    return el;
  }
  function pickupEl(){
    const el=document.createElement('div');el.className='pickup-marker';
    el.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/></svg><span class="pickup-label">UrbanFlowers</span><span class="entrance-tag">Entrance</span>';
    return el;
  }
  function fallbackRoute(){return {type:'Feature',geometry:{type:'LineString',coordinates:[current,[100.5692,13.7320],[100.5719,13.7323],[100.5732,13.7330],PICKUP]}}}
  async function initMap(){
    if(!window.mapboxgl){loadingNote.textContent='Offline map';return}
    try{
      mapboxgl.accessToken=TOKEN;
      const map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/light-v11',center:[(current[0]+PICKUP[0])/2,(current[1]+PICKUP[1])/2],zoom:state==='near'?16.8:14.7,bearing:18,pitch:0,attributionControl:true,interactive:true});
      map.dragRotate.disable();map.touchZoomRotate.disableRotation();
      new mapboxgl.Marker({element:driverEl(),anchor:'center'}).setLngLat(current).addTo(map);
      new mapboxgl.Marker({element:pickupEl(),anchor:'center'}).setLngLat(PICKUP).addTo(map);
      map.on('load',async()=>{
        loadingNote.classList.add('hidden');
        let route=fallbackRoute();
        try{
          const path=`${current[0]},${current[1]};${PICKUP[0]},${PICKUP[1]}`;
          const r=await fetch(`https://api.mapbox.com/directions/v5/mapbox/driving-traffic/${path}?geometries=geojson&overview=full&steps=true&access_token=${encodeURIComponent(TOKEN)}`);
          const data=await r.json();
          if(data.routes&&data.routes[0]) route={type:'Feature',geometry:data.routes[0].geometry};
        }catch(e){}
        map.addSource('route',{type:'geojson',data:route});
        map.addLayer({id:'route-shadow',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffffff','line-width':10,'line-opacity':.96}});
        map.addLayer({id:'route',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ff6420','line-width':5.5}});
        const b=new mapboxgl.LngLatBounds();route.geometry.coordinates.forEach(c=>b.extend(c));b.extend(PICKUP);b.extend(current);
        map.fitBounds(b,{padding:{top:132,bottom:150,left:54,right:54},duration:0,maxZoom:state==='near'?17.2:15.6});
      });
      map.on('error',()=>{});
    }catch(e){useOfflineMap()}
  }
  function useOfflineMap(){
    frame.classList.remove('live-map');
    loadingNote.textContent='Offline map';
    loadingNote.classList.remove('hidden');
  }
  function loadMapbox(){
    if(params.get('offline')==='1'){useOfflineMap();return}
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.css';document.head.appendChild(css);
    const script=document.createElement('script');script.src='https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.js';script.async=true;
    let done=false;
    const timer=setTimeout(()=>{if(!done)useOfflineMap()},4500);
    script.onload=()=>{done=true;clearTimeout(timer);frame.classList.add('live-map');initMap()};
    script.onerror=()=>{done=true;clearTimeout(timer);useOfflineMap()};
    document.head.appendChild(script);
  }
  loadMapbox();
</script>
</body>
</html>
