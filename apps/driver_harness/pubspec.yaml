name: rounds_driver_harness
description: Combined navigation and operational telemetry field harness for Rounds Phase 0.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  cryptography: 2.9.0
  ffi: 2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  file_picker: ^12.2.0
  geolocator: ^14.0.3
  google_navigation_flutter: ^0.11.0
  http: 1.6.0
  image_picker: ^1.2.1
  just_audio: ^0.10.5
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  sqlite3: 3.5.2
  record: ^6.1.2
  realtime_client: ^2.13.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/NotoSansThai-Variable.ttf
