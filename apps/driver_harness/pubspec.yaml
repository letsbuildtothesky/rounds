name: rounds_driver_harness
description: Combined navigation and operational telemetry field harness for Rounds Phase 0.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.3
  google_navigation_flutter: ^0.11.0
  http: ^1.6.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  generate: true
